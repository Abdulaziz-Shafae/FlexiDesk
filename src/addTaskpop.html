<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Popup</title>
    <style>
      /* Background overlay */
      .popup {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.3); /* Slightly transparent black */
        backdrop-filter: blur(4px); /* Adds a blur effect */
      }

      /* Popup container */
      .popup-content {
        background: white;
        width: 560px; 
        padding: 0;
        margin: 28% auto;
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1); /* Softer shadow */
        position: relative;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        border-radius: 4px;
        gap: 4px;
        border: 2px solid #e0e5f2; /* Light gray border */
        background-color: #ffffff; /* Light gray background */
      }

      /* Header with gray background */
      .popup-content h2 {
        background-color: #e0e5f2; /* Light gray */
        color: rgb(0, 0, 0);
        padding: 12px;
        font-size: 16px;
        margin: 0;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Close button inside gray box */
      .addTask-close-btn {
        font-size: 30px;
        color: rgb(171, 171, 171);
        background: none;
        border: none;
        cursor: pointer;
        position: absolute;
        right: 20px;
        top: 4px;
      }

      /* Close button hover */
      .addTask-close-btn:hover {
        color: #333;
      }

      /* Labels */
      .addTask-label {
        padding-left: 2%;
        font-weight: 600;
        display: block;
        font-size: 16px;
        margin-bottom: 0px; /* Added gap under labels */
      }

      /* Inputs, selects, and textareas */
      .addTask-input,
      .addTask-select,
      .addTask-textarea {
        font-weight: bold;
        margin-left: 2%;
        height: 30px;
        width: 94%;
        padding: 1px;
        margin-top: 0px;
        border: 1px solid #ccc;
        font-size: 16px;
        box-sizing: border-box;
        background-color: #ffffff; /* Light background for input fields */
      }

      /* Adjust height for description */
      .addTask-textarea {
        height: 50px;
        resize: vertical;
      }

      /* Time Period Section */
      .addTask-time-period {
        display: flex;
        gap: 3px;
        margin-right: 3%;
      }

      /* Time Period Inputs */
      .addTask-date {
        border-radius: 2px;
        font-weight: bold;
        height: 30px;
        text-align: center;
        border: 1px solid #ccc;
      }

      /* Time Period Section Container */
      .time-period-container {
        display: flex;
        justify-content: space-between;
        width: 100%;
        align-items: center;
      }

      /* End Date */
      .end-date {
        font-size: 14px;
        padding-left: 10px;
        text-align: left;
        width: 50%; /* To make sure it doesn't overlap */
      }

      /* Day Control Buttons */
      .day-control {
        display: flex;
        gap: 20px;
        border-style: solid;
        border-width: 1px;
        border-radius: 5px;
        border-color: #ccc;
        align-items: center;
      }

      .day-button {
        font-size: 18px;
        color: #5b7bf3;
        background-color: white;
        border-width: 1px;
        border-color: #ccc;
        cursor: pointer;
        height: 30px;
        width: 30px;
      }

      /* Button container */
      .button-container {
        display: flex;
        display: flex; justify-content: flex-end;
            }

      /* Buttons */
      .addTask-save-btn,
      .addTask-cancel-btn,
      .addTask-delete-btn {
        margin: 2%;
        padding: 6px 20px;
        cursor: pointer;
        border-radius: 6px;
        font-size: 14px;
        border: none;
        width: 90px;
      }

      /* Save button */
      .addTask-save-btn {
        width: 80px;
        margin-left: 0;

        background: #5b7bf3; /* Blue */
        color: white;
      }

      .addTask-save-btn:hover {
        background: #4463d4; /* Darker blue */
      }

      /* Cancel button */
      .addTask-cancel-btn {
        width: 90px;
        margin-right: 1%;
        background: #ffffff;
        border: solid;
        border-width: 1.5px;
        border-color: #5b7bf3;
        color: #5b7bf3;
      }

      .addTask-cancel-btn:hover {
        background: #e0e5f2; /* Darker gray */
      }

      /* Delete button */
      .addTask-delete-btn {
        position: absolute;
        left: 0;
        width: 90px;
        background: transparent;
        color: #d03e51;
        border: none;
        font-weight: bold;
      }

      .addTask-delete-btn:hover {
        color: darkred;
      }
    </style>
  </head>
  <body>
    <div id="taskPopup" class="popup">
      <div class="popup-content">
        <h2>New Task</h2>
        <span class="addTask-close-btn">&times;</span>

        <!-- Task Name -->
        <label for="task-name" class="addTask-label">Name</label>
        <input type="text" id="task-name" class="addTask-input" placeholder="Enter task name" />

        <!-- Task Type -->
        <label for="task-type" class="addTask-label">Type</label>
        <select id="task-type" class="addTask-select">
          <option value="task">Task</option>
          <option value="milestone">Milestone</option>
        </select>

        <!-- Task Priority -->
        <label for="task-priority" class="addTask-label">Priority</label>
        <select id="task-priority" class="addTask-select">
          <option value="1">Low</option>
          <option value="2">Medium-low</option>
          <option value="3">Medium</option>
          <option value="4">High</option>
          <option value="5">Critical</option>
        </select>

        <!-- Task Description -->
        <label for="task-desc" class="addTask-label">Description</label>
        <textarea id="task-desc" class="addTask-textarea" ></textarea>

        <!-- Time Period -->
        <label for="time-period" class="addTask-label">Time Period</label>
        <div class="time-period-container">
          <div class="addTask-time-period">
            <!-- Day Drop-down List -->
            <select id="day" class="addTask-date" style="margin-left: 5.2%; width: 50px;">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23">23</option>
              <option value="24">24</option>
              <option value="25">25</option>
              <option value="26">26</option>
              <option value="27">27</option>
              <option value="28">28</option>
              <option value="29">29</option>
              <option value="30">30</option>
              <option value="31">31</option>
            </select>

            <!-- Month Drop-down List -->
            <select id="month" class="addTask-date" style="width: 110px;">
              <option>January</option>
              <option>February</option>
              <option>March</option>
              <option>April</option>
              <option>May</option>
              <option>June</option>
              <option>July</option>
              <option>August</option>
              <option>September</option>
              <option>October</option>
              <option>November</option>
              <option>December</option>
            </select>

            <!-- Year Drop-down List -->
            <select id="year" class="addTask-date" style="width: 70px;">
              <option>2020</option>
              <option>2021</option>
              <option>2022</option>
              <option>2023</option>
              <option>2024</option>
              <option>2025</option>
              <option>2026</option>
              <option>2027</option>
              <option>2028</option>
              <option>2029</option>
              <option>2030</option>
            </select>
          </div>

          <div class="day-control">
            <!-- Day increment/decrement buttons -->
            <button id="decrease-day" class="day-button" style="border-radius: 3px 0 0 3px;">-</button>
            <span id="days-count">1</span>
            <button id="increase-day" class="day-button" style="border-radius: 0 3px 3px 0;">+</button>
          </div>
          <div class="end-date" id="end-date">Days 02 February 2025</div>
        </div>

        <!-- Button Container -->
        <div class="button-container">
          <button id="delete-task" class="addTask-delete-btn">Delete</button>
          <button id="cancel-task" class="addTask-cancel-btn">Cancel</button>
          <button id="save-task" class="addTask-save-btn">Save</button>
        </div>
      </div>
    </div>

    <script>
      const popup = document.getElementById('taskPopup');
      const closeButton = document.querySelector('.addTask-close-btn');
      const cancelButton = document.getElementById('cancel-task');

      // Show popup when needed
      function openPopup() {
        popup.style.display = 'block';
      }

      // Close the popup
      function closePopup() {
        popup.style.display = 'none';
      }

      // Attach events to close buttons
      closeButton.addEventListener('click', closePopup);
      cancelButton.addEventListener('click', closePopup);

      // Close popup if user clicks outside
      window.addEventListener('click', (event) => {
        if (event.target === popup) {
          closePopup();
        }
      });

      // Update the end date based on selected start date and duration
      function updateEndDate() {
        const day = parseInt(document.getElementById('day').value);
        const month = document.getElementById('month').selectedIndex + 1; // Months are 0-based in JS
        const year = parseInt(document.getElementById('year').value);
        const duration = parseInt(document.getElementById('days-count').innerText) || 1; // Duration in days

        if (isNaN(day) || isNaN(month) || isNaN(year)) return;

        const startDate = new Date(year, month - 1, day); // Create the start date
        startDate.setDate(startDate.getDate() + duration); // Add duration to get the end date

        const endDateStr = `${startDate.getDate()} ${startDate.toLocaleString('default', { month: 'long' })} ${startDate.getFullYear()}`;
        document.getElementById('end-date').textContent = ` Days ${endDateStr}`;
      }

      // Event listeners for date, month, and year changes
      document.getElementById('day').addEventListener('change', updateEndDate);
      document.getElementById('month').addEventListener('change', updateEndDate);
      document.getElementById('year').addEventListener('change', updateEndDate);

      // Event listeners for increasing/decreasing days
      document.getElementById('increase-day').addEventListener('click', function() {
        let days = parseInt(document.getElementById('days-count').innerText);
        document.getElementById('days-count').innerText = days + 1;
        updateEndDate();
      });

      document.getElementById('decrease-day').addEventListener('click', function() {
        let days = parseInt(document.getElementById('days-count').innerText);
        if (days > 1) {
          document.getElementById('days-count').innerText = days - 1;
          updateEndDate();
        }
      });

      // Open the popup for testing
      openPopup();
    </script>
  </body>
</html>
