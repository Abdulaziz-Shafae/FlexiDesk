<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Popup</title>
    <style>
      /* Background overlay */
      .popup {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.3); /* Slightly transparent black */
        backdrop-filter: blur(4px); /* Adds a blur effect */
      }

      /* Popup container */
      .popup-content {
        background: white;
        width: 520px; /* Adjusted width to match the image */
        padding: 0;
        margin: 10% auto;
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1); /* Softer shadow */
        position: relative;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 4px;
        border: 2px solid #e0e5f2; /* Light gray border */
        background-color: #ffffff; /* Light gray background */
      }

      /* Header with gray background */
      .popup-content h2 {
        background-color: #e0e5f2; /* Light gray */
        color: rgb(0, 0, 0);
        padding: 15px;
        font-size: 16px;
        margin: 0;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Close button inside gray box */
      .addTask-close-btn {
        font-size: 18px;
        font-weight: bold;
        color: rgb(171, 171, 171);
        background: none;
        border: none;
        cursor: pointer;
        position: absolute;
        right: 20px;
        top: 15px;
      }

      /* Close button hover */
      .addTask-close-btn:hover {
        color: #333;
      }

      /* Labels */
      .addTask-label {
        padding-left: 3%;
        font-weight: 600;
        display: block;
        font-size: 16px;
        margin-bottom: 0px; /* Added gap under labels */
      }

      /* Inputs, selects, and textareas */
      .addTask-input,
      .addTask-select,
      .addTask-textarea {
        margin-left: 3%;
        height: 30px;
        width: 94%;
        padding: 1px;
        margin-top: 0px;
        border: 1px solid #ccc;
        font-size: 16px;
        box-sizing: border-box;
        background-color: #ffffff; /* Light background for input fields */
      }

      /* Adjust height for description */
      .addTask-textarea {
        height: 50px;
        resize: vertical;
      }

      /* Time Period Section */
      .addTask-time-period {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      /* Time Period Inputs */
      .addTask-date {
        width: 50px;
        padding: 10px;
        border: 1px solid #ccc;
      }

      /* Button container */
      .button-container {
        display: flex;
        justify-content: space-between; /* Align buttons in a row */
      }

      /* Buttons */
      .addTask-save-btn,
      .addTask-cancel-btn,
      .addTask-delete-btn {
        padding: 12px 20px;
        cursor: pointer;
        border-radius: 6px;
        font-size: 14px;
        border: none;
        width: 90px; /* Buttons take up equal space */
      }

      /* Save button */
      .addTask-save-btn {
        background: #5b7bf3; /* Blue */
        color: white;
      }

      .addTask-save-btn:hover {
        background: #4463d4; /* Darker blue */
      }

      /* Cancel button */
      .addTask-cancel-btn {
        background: #ffffff; 
        border: solid;
        border-width: 1.5px;
        border-color: #5b7bf3;
        color: #5b7bf3;
      }

      .addTask-cancel-btn:hover {
        background: #e0e5f2; /* Darker gray */
      }

      /* Delete button */
      .addTask-delete-btn {
        background: transparent;
        color: #d03e51;
        border: none;
        font-weight: bold;
      }

      .addTask-delete-btn:hover {
        color: darkred;
      }
    </style>
  </head>
  <body>
    <div id="taskPopup" class="popup">
      <div class="popup-content">
        <h2>New Task</h2>
        <span class="addTask-close-btn">&times;</span>

        <!-- Task Name -->
        <label for="task-name" class="addTask-label">Name</label>
        <input type="text" id="task-name" class="addTask-input" placeholder="Enter task name" />

        <!-- Task Type -->
        <label for="task-type" class="addTask-label">Type</label>
        <select id="task-type" class="addTask-select">
          <option value="task">Task</option>
          <option value="milestone">Milestone</option>
        </select>

        <!-- Task Priority -->
        <label for="task-priority" class="addTask-label">Priority</label>
        <select id="task-priority" class="addTask-select">
          <option value="1">Low</option>
          <option value="2">Medium-low</option>
          <option value="3">Medium</option>
          <option value="4">High</option>
          <option value="5">Critical</option>
        </select>

        <!-- Task Description -->
        <label for="task-desc" class="addTask-label">Description</label>
        <textarea id="task-desc" class="addTask-textarea" placeholder="Enter description"></textarea>

        <!-- Time Period -->
        <label for="time-period" class="addTask-label">Time Period</label>
        <div class="addTask-time-period">
          <input type="number" min="1" class="addTask-date" placeholder="1" />
          <select class="addTask-date">
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
          </select>
          <input type="number" min="2025" class="addTask-date" placeholder="2025" />
        </div>

        <!-- Button Container -->
        <div class="button-container">
          <button id="delete-task" class="addTask-delete-btn">Delete</button>
          <button id="cancel-task" class="addTask-cancel-btn">Cancel</button>
          <button id="save-task" class="addTask-save-btn">Save</button>
        </div>
      </div>
    </div>

    <script>
      const popup = document.getElementById('taskPopup');
      const closeButton = document.querySelector('.addTask-close-btn');
      const cancelButton = document.getElementById('cancel-task');

      // Show popup when needed
      function openPopup() {
        popup.style.display = 'block';
      }

      // Close the popup
      function closePopup() {
        popup.style.display = 'none';
      }

      // Attach events to close buttons
      closeButton.addEventListener('click', closePopup);
      cancelButton.addEventListener('click', closePopup);

      // Close popup if user clicks outside
      window.addEventListener('click', (event) => {
        if (event.target === popup) {
          closePopup();
        }
      });

      // Open the popup for testing
      openPopup();
    </script>
  </body>
</html>
