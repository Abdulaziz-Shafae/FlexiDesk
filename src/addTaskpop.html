
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Popup</title>
    <style>
      .popup {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(4px);
      }

      .popup-content {
        background: white;
        width: 560px;
        padding: 0;
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
        position: fixed; 
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); 
        display: flex;
        flex-direction: column;
        border-radius: 4px;
        gap: 4px;
        border: 2px solid #e0e5f2;
      }


      .popup-content h2 {
        background-color: #e0e5f2;
        color: black;
        padding: 12px;
        font-size: 16px;
        margin: 0;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: move;
      }

      .addTask-close-btn {
        font-size: 30px;
        color: rgb(171, 171, 171);
        background: none;
        border: none;
        cursor: pointer;
        position: absolute;
        right: 20px;
        top: 4px;
      }

      .addTask-close-btn:hover {
        color: #333;
      }

      .addTask-label {
        padding-left: 2%;
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 0;
      }

      .addTask-input,
      .addTask-select,
      .addTask-textarea {
        font-weight: bold;
        margin-left: 2%;
        height: 30px;
        width: 94%;
        padding: 1px;
        margin-top: 0px;
        border: 1px solid #ccc;
        font-size: 16px;
        box-sizing: border-box;
        background-color: #fff;
      }

      .addTask-textarea {
        height: 50px;
        resize: vertical;
      }

      .addTask-time-period {
        display: flex;
        gap: 3px;
        margin-right: 3%;
      }

      .addTask-date {
        border-radius: 2px;
        font-weight: bold;
        height: 30px;
        text-align: center;
        border: 1px solid #ccc;
      }

      .time-period-container {
        display: flex;
        justify-content: space-between;
        width: 100%;
        align-items: center;
      }

      .end-date {
        font-size: 14px;
        padding-left: 10px;
        text-align: left;
        width: 50%;
      }

      .day-control {
        display: flex;
        gap: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        align-items: center;
      }

      .day-button {
        font-size: 18px;
        color: #5b7bf3;
        background-color: white;
        border: 1px solid #ccc;
        cursor: pointer;
        height: 30px;
        width: 30px;
      }

      .button-container {
        display: flex;
        justify-content: flex-end;
      }

      .addTask-save-btn,
      .addTask-cancel-btn,
      .addTask-delete-btn {
        margin: 2%;
        padding: 6px 20px;
        cursor: pointer;
        border-radius: 6px;
        font-size: 14px;
        border: none;
        width: 90px;
      }

      .addTask-save-btn {
        width: 80px;
        margin-left: 0;
        background: #5b7bf3;
        color: white;
      }

      .addTask-save-btn:hover {
        background: #4463d4;
      }

      .addTask-cancel-btn {
        background: #ffffff;
        border: 1.5px solid #5b7bf3;
        color: #5b7bf3;
      }

      .addTask-cancel-btn:hover {
        background: #e0e5f2;
      }

      .addTask-delete-btn {
        position: absolute;
        left: 0;
        background: transparent;
        color: #d03e51;
        font-weight: bold;
      }

      .addTask-delete-btn:hover {
        color: darkred;
      }
    </style>
  </head>
  <body>
    <div id="taskPopup" class="popup">
      <div class="popup-content">
        <h2 class="popup-header">New Task</h2>
        <span class="addTask-close-btn">&times;</span>

        <!-- Project Selection -->
        <input type="hidden" id="projectStartDate" />
        <input type="hidden" id="projectEndDate" />
        <input type="hidden" id="projectID" name="projectID" />

        <!-- Task Name -->
        <label for="taskName" class="addTask-label">Task Name</label>
        <input type="text" id="taskName" name="taskName" class="addTask-input" placeholder="Enter task name" required/>
        
        <!-- Task Type -->
        <label for="taskType" class="addTask-label">Task Type</label>
        <select id="taskType" name="taskType" class="addTask-select" required>
          <option value="" disabled selected hidden>Select The Type</option>
          <option value="Task">Task</option>
          <option value="Milestone">Milestone</option>
        </select>

        <!-- Priority -->
        <label for="priority" class="addTask-label">Task Priority</label>
        <select id="priority" name="priority" class="addTask-select" >
          <option value="" disabled selected hidden>Select The Priority</option>
          <option value="low">Low</option>
          <option value="medium-low">Medium-low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>          
        </select>

        <!-- Assign to -->
        <label for="assignTo" class="addTask-label">Assign to</label>
        <select id="assignTo" name="assignTo" class="addTask-select" required>
        </select>

        <!-- Task Description -->
        <label for="taskDescription" class="addTask-label">Task Description</label>
        <textarea id="taskDescription" name="taskDescription" class="addTask-textarea" ></textarea>     
        
        <!-- Task status -->
        <label for="status" class="addTask-label">Task Status</label>
        <select id="status" name="status" class="addTask-select" >
          <option value="" disabled selected hidden>Select The Status</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>     
        </select>

        <!-- Task Dates -->
        <label for="time-period" class="addTask-label">Time Period</label>
        <div class="time-period-container">
          <div class="addTask-time-period">
            <select id="day" class="addTask-date" style="margin-left: 5.2%; width: 50px;">
              <option value="1" selected>1</option>
            </select>
        
            <select id="month" class="addTask-date" style="width: 110px;">
              <option value="January" selected>January</option>
            </select>
        
            <select id="year" class="addTask-date" style="width: 70px;">
              <option value="2025" selected>2025</option>
            </select>
          </div>
        
          <div class="day-control">
            <button id="decrease-day" class="day-button" style="border-radius: 3px 0 0 3px;">-</button>
            <span id="days-count">1</span>
            <button id="increase-day" class="day-button" style="border-radius: 0 3px 3px 0;">+</button>
          </div>
          <div class="end-date" id="end-date"></div>
        </div>



        <!-- File Requirement -->
        <div class="checkbox-group" style="margin-left: 2%; margin-top: 8px;">
          <input type="checkbox" id="fileRequired" onclick="document.getElementById('fileUpload').style.display = this.checked ? 'block' : 'none'" />
          <label for="fileRequired">Does this task require a file?</label>
        </div>
        
        <!-- fileUpload -->
        <div class="file-upload" id="fileUpload" style="display:none; margin-left: 2%;">
          <label for="taskFile">Upload File</label>
          <input type="file" id="taskFile" class="addTask-input" />
        </div>
        
        <div class="button-container">
          <button id="delete-task" class="addTask-delete-btn">Delete</button>
          <button id="cancel-task" class="addTask-cancel-btn">Cancel</button>
          <button id="save-task" class="addTask-save-btn">Save</button>
        </div>
      </div>
    </div>
  </body>
</html>
