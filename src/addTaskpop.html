
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Popup</title>
    <style>
      .popup {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(4px);
      }

      .popup-content {
        background: white;
        width: 560px;
        padding: 0;
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
        position: fixed; 
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); 
        display: flex;
        flex-direction: column;
        border-radius: 4px;
        gap: 4px;
        border: 2px solid #e0e5f2;
      }


      .popup-content h2 {
        background-color: #e0e5f2;
        color: black;
        padding: 12px;
        font-size: 16px;
        margin: 0;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: move;
      }

      .addTask-close-btn {
        font-size: 30px;
        color: rgb(171, 171, 171);
        background: none;
        border: none;
        cursor: pointer;
        position: absolute;
        right: 20px;
        top: 4px;
      }

      .addTask-close-btn:hover {
        color: #333;
      }

      .addTask-label {
        padding-left: 2%;
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 0;
      }

      .addTask-input,
      .addTask-select,
      .addTask-textarea {
        font-weight: bold;
        margin-left: 2%;
        height: 30px;
        width: 94%;
        padding: 1px;
        margin-top: 0px;
        border: 1px solid #ccc;
        font-size: 16px;
        box-sizing: border-box;
        background-color: #fff;
      }

      .addTask-textarea {
        height: 50px;
        resize: vertical;
      }

      .addTask-time-period {
        display: flex;
        gap: 3px;
        margin-right: 3%;
      }

      .addTask-date {
        border-radius: 2px;
        font-weight: bold;
        height: 30px;
        text-align: center;
        border: 1px solid #ccc;
      }

      .time-period-container {
        display: flex;
        justify-content: space-between;
        width: 100%;
        align-items: center;
      }

      .end-date {
        font-size: 14px;
        padding-left: 10px;
        text-align: left;
        width: 50%;
      }

      .day-control {
        display: flex;
        gap: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        align-items: center;
      }

      .day-button {
        font-size: 18px;
        color: #5b7bf3;
        background-color: white;
        border: 1px solid #ccc;
        cursor: pointer;
        height: 30px;
        width: 30px;
      }

      .button-container {
        display: flex;
        justify-content: flex-end;
      }

      .addTask-save-btn,
      .addTask-cancel-btn,
      .addTask-delete-btn {
        margin: 2%;
        padding: 6px 20px;
        cursor: pointer;
        border-radius: 6px;
        font-size: 14px;
        border: none;
        width: 90px;
      }

      .addTask-save-btn {
        width: 80px;
        margin-left: 0;
        background: #5b7bf3;
        color: white;
      }

      .addTask-save-btn:hover {
        background: #4463d4;
      }

      .addTask-cancel-btn {
        background: #ffffff;
        border: 1.5px solid #5b7bf3;
        color: #5b7bf3;
      }

      .addTask-cancel-btn:hover {
        background: #e0e5f2;
      }

      .addTask-delete-btn {
        position: absolute;
        left: 0;
        background: transparent;
        color: #d03e51;
        font-weight: bold;
      }

      .addTask-delete-btn:hover {
        color: darkred;
      }
    </style>
  </head>
  <body>
    <div id="taskPopup" class="popup">
      <div class="popup-content">
        <h2 class="popup-header">New Task</h2>
        <span class="addTask-close-btn">&times;</span>

        <label for="task-name" class="addTask-label">Task Name</label>
        <input type="text" id="task-name" class="addTask-input" placeholder="Enter task name" />

        <label for="task-type" class="addTask-label">Task Type</label>
        <select id="task-type" class="addTask-select">
          <option value="task">Task</option>
          <option value="milestone">Milestone</option>
        </select>        
        
        <label for="task-priority" class="addTask-label">Task Priority</label>
        <select id="task-priority" class="addTask-select">
          <option value="1">Low</option>
          <option value="2">Medium-low</option>
          <option value="3">Medium</option>
          <option value="4">High</option>
          <option value="5">Critical</option>
        </select>

        <label for="assignTo" class="addTask-label">Assign to</label>
        <select id="assignTo" class="addTask-select">
          <option value="" disabled selected hidden>Select a project First</option>
        </select>

        <label for="task-desc" class="addTask-label">Task Description</label>
        <textarea id="task-desc" class="addTask-textarea"></textarea>

        <label for="time-period" class="addTask-label">Time Period</label>
        <div class="time-period-container">
          <div class="addTask-time-period">
            <select id="day" class="addTask-date" style="margin-left: 5.2%; width: 50px;">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23">23</option>
              <option value="24">24</option>
              <option value="25">25</option>
              <option value="26">26</option>
              <option value="27">27</option>
              <option value="28">28</option>
              <option value="29">29</option>
              <option value="30">30</option>
              <option value="31">31</option>
            </select>

            <select id="month" class="addTask-date" style="width: 110px;">
              <option>January</option>
              <option>February</option>
              <option>March</option>
              <option>April</option>
              <option>May</option>
              <option>June</option>
              <option>July</option>
              <option>August</option>
              <option>September</option>
              <option>October</option>
              <option>November</option>
              <option>December</option>
            </select>

            <select id="year" class="addTask-date" style="width: 70px;">
              <option>2020</option>
              <option>2021</option>
              <option>2022</option>
              <option>2023</option>
              <option>2024</option>
              <option>2025</option>
              <option>2026</option>
              <option>2027</option>
              <option>2028</option>
              <option>2029</option>
              <option>2030</option>
            </select>
          </div>

          <div class="day-control">
            <button id="decrease-day" class="day-button" style="border-radius: 3px 0 0 3px;">-</button>
            <span id="days-count">1</span>
            <button id="increase-day" class="day-button" style="border-radius: 0 3px 3px 0;">+</button>
          </div>
          <div class="end-date" id="end-date">End Date 02 February 2025</div>
        </div>

        <div class="button-container">
          <button id="delete-task" class="addTask-delete-btn">Delete</button>
          <button id="cancel-task" class="addTask-cancel-btn">Cancel</button>
          <button id="save-task" class="addTask-save-btn">Save</button>
        </div>
      </div>
    </div>
  </body>
</html>
