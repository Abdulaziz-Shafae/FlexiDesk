<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - FlexiDesk</title>
  <link rel="stylesheet" href="navbarStyle.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* ===== VARIABLES ===== */
    :root {
      /* Light mode colors */
      --primary-color: #0d2240;
      --secondary-color: #3d5af1;
      --accent-color: #22d1ee;
      --text-color: #1a1a1a;
      --background-color: #ffffff;
      --card-bg-light: #ffffff;
      --card-shadow: rgba(0, 0, 0, 0.04);
      --gradient-start: #3d5af1;
      --gradient-end: #22d1ee;
      --border-color: rgba(0, 0, 0, 0.08);
      --subtle-bg: #f8f9fa;
      --navbar-bg: rgba(255, 255, 255, 0.9);
      --navbar-text: #0d2240;
      --navbar-shadow: rgba(0, 0, 0, 0.05);
      --navbar-hover: #3d5af1;
      --navbar-active: #22d1ee;
      --button-bg: #3d5af1;
      --button-text: #ffffff;
      --button-hover: #0d2240;
    }

    /* Dark mode variables */
    .dark-mode {
      --primary-color: #22d1ee;
      --secondary-color: #3d5af1;
      --accent-color: #f5f5f5;
      --text-color: #f1f1f1;
      --background-color: #111111;
      --card-bg-light: #1a1a1a;
      --card-shadow: rgba(0, 0, 0, 0.25);
      --gradient-start: #3d5af1;
      --gradient-end: #22d1ee;
      --border-color: rgba(255, 255, 255, 0.1);
      --subtle-bg: #1e1e1e;
      --navbar-bg: rgba(17, 17, 17, 0.95);
      --navbar-text: #f1f1f1;
      --navbar-shadow: rgba(0, 0, 0, 0.3);
      --navbar-hover: #22d1ee;
      --navbar-active: #3d5af1;
      --button-bg: #22d1ee;
      --button-text: #111111;
      --button-hover: #3d5af1;
    }

    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', 'Arial', sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      transition: all 0.3s ease;
      line-height: 1.6;
    }

    /* ===== NAVBAR STYLES ===== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 80px;
      padding: 0 40px;
      background-color: var(--navbar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px var(--navbar-shadow);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      transition: all 0.4s cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .navbar.scrolled {
      height: 70px;
      padding: 0 30px;
    }

    /* Logo Styles */
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
      border-radius: 10px;
      color: white;
      font-size: 18px;
    }

    .logo-text {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--navbar-text);
      letter-spacing: -0.03em;
      transition: all 0.3s ease;
    }

    .logo:hover .logo-text {
      color: var(--navbar-hover);
    }

    .logo:hover .logo-icon {
      transform: rotate(-5deg) scale(1.1);
    }

    /* Navigation Links */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-links a {
      position: relative;
      padding: 8px 16px;
      color: var(--navbar-text);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.3s ease;
      border-radius: 6px;
    }

    .nav-links a:hover {
      color: var(--navbar-hover);
      background-color: rgba(61, 90, 241, 0.05);
    }

    .nav-links a.active {
      color: var(--navbar-active);
      font-weight: 600;
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: linear-gradient(90deg, var(--secondary-color), var(--accent-color));
      border-radius: 3px;
    }

    /* Auth Buttons */
    .auth-buttons {
      display: flex;
      gap: 12px;
    }

    .auth-button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn {
      background-color: transparent;
      color: var(--navbar-text);
      border: 1px solid var(--navbar-text);
    }

    .login-btn:hover {
      background-color: rgba(61, 90, 241, 0.05);
      border-color: var(--navbar-hover);
      color: var(--navbar-hover);
    }

    .signup-btn {
      background-color: var(--button-bg);
      color: var(--button-text);
      box-shadow: 0 4px 15px rgba(61, 90, 241, 0.25);
    }

    .signup-btn:hover {
      background-color: var(--button-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(61, 90, 241, 0.3);
    }

    /* Dark Mode Toggle */
    .dark-mode-container {
      display: flex;
      align-items: center;
      margin-right: 15px;
    }

    .dark-mode-toggle {
      position: relative;
      width: 48px;
      height: 24px;
      border-radius: 12px;
      background-color: rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dark-mode .dark-mode-toggle {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .toggle-thumb {
      position: absolute;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dark-mode .toggle-thumb {
      left: 26px;
      background-color: var(--accent-color);
    }

    .toggle-icon {
      font-size: 12px;
      color: #ffc107;
    }

    .dark-mode .toggle-icon {
      color: #2c3e50;
    }

    /* Mobile Menu Button (visible on small screens) */
    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 21px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 1001;
    }

    .menu-toggle span {
      width: 100%;
      height: 3px;
      background-color: var(--navbar-text);
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    /* ===== TYPOGRAPHY ===== */
    h1, h2, h3, h4, h5, h6 {
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: var(--primary-color);
    }

    h1 {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
      width: 100%;
      letter-spacing: -0.03em;
    }

    h2 {
      font-size: 2.5rem;
      letter-spacing: -0.02em;
    }

    p {
      line-height: 1.8;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    /* ===== LAYOUT ===== */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    main {
      padding: 150px 0 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* ===== CONTACT SECTION ===== */
    .contact-card {
      background-color: var(--card-bg-light);
      border-radius: 15px;
      box-shadow: 0 10px 30px var(--card-shadow);
      border: 1px solid var(--border-color);
      padding: 50px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .contact-info {
      margin: 30px 0;
    }

    .contact-info p {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }

    .contact-info i {
      font-size: 1.5rem;
      color: var(--secondary-color);
      margin-right: 20px;
      width: 25px;
      text-align: center;
    }

    .contact-info a {
      color: var(--secondary-color);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .contact-info a:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    /* Contact Form */
    .contact-form {
      margin-top: 20px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      background-color: var(--background-color);
      color: var(--text-color);
      transition: all 0.3s ease;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(61, 90, 241, 0.2);
    }

    .contact-form textarea {
      min-height: 150px;
      resize: vertical;
    }

    .contact-form button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .contact-form button:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(61, 90, 241, 0.3);
    }

    /* ===== REVEAL ANIMATIONS ===== */
    .reveal {
      position: relative;
      opacity: 0;
      transform: translateY(50px);
      transition: all 1s cubic-bezier(0.5, 0, 0, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 { transition-delay: 0.1s; }
    .delay-2 { transition-delay: 0.2s; }
    .delay-3 { transition-delay: 0.3s; }

    /* ===== MEDIA QUERIES ===== */
    @media (max-width: 1200px) {
      .contact-card {
        padding: 40px;
      }
    }

    @media (max-width: 992px) {
      h1 {
        font-size: 2.5rem;
      }
      
      .navbar {
        padding: 0 20px;
      }
      
      .dark-mode-container {
        margin-right: 10px;
      }
    }
    
    @media (max-width: 768px) {
      main {
        padding: 100px 0 70px;
      }
      
      .contact-card {
        padding: 30px;
      }
      
      h1 {
        font-size: 2.2rem;
      }
      
      .menu-toggle {
        display: flex;
      }
      
      .menu-open .menu-toggle span:nth-child(1) {
        transform: translateY(9px) rotate(45deg);
      }
      
      .menu-open .menu-toggle span:nth-child(2) {
        opacity: 0;
      }
      
      .menu-open .menu-toggle span:nth-child(3) {
        transform: translateY(-9px) rotate(-45deg);
      }
      
      .nav-links {
        position: fixed;
        top: 80px;
        left: 0;
        right: 0;
        background-color: var(--navbar-bg);
        flex-direction: column;
        padding: 20px;
        box-shadow: 0 10px 30px var(--navbar-shadow);
        clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
        transition: all 0.4s cubic-bezier(0.215, 0.61, 0.355, 1);
        pointer-events: none;
      }
      
      .menu-open .nav-links {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        pointer-events: all;
      }
      
      .nav-links a {
        width: 100%;
        text-align: center;
        padding: 15px;
      }
      
      .auth-buttons {
        margin-top: 15px;
        width: 100%;
      }
      
      .auth-button {
        flex: 1;
      }
    }

    @media (max-width: 576px) {
      .container {
        padding: 0 20px;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .logo-text {
        font-size: 1.5rem;
      }
      
      .navbar {
        height: 70px;
      }
    }
  </style>
</head>
<body>
  <!-- Include the navbar -->
  <div id="navbar-container"></div>

  <!-- Main Content -->
  <main>
    <div class="container">
      <div class="contact-card reveal">
        <h1>Contact Us</h1>

        <div class="contact-info reveal delay-1">
          <p>
            <i class="fas fa-users"></i> <strong>Team Members:</strong> Salman
            Hassan, Ammar Abdo, Saud Al-Ruzaiqi, Abdulrahman Kateb, Abdulaziz
            Al-Shafee
          </p>
          <p>
            <i class="fas fa-envelope"></i> <strong>Email:</strong>
            <a href="mailto:FlexiDesk@hotmail.com">FlexiDesk@hotmail.com</a>
          </p>
          <p>
            <i class="fas fa-phone"></i> <strong>Phone:</strong> +966 5** ***
            ****
          </p>
        </div>

        <h2>Send us a message</h2>
        <form class="contact-form reveal delay-2">
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <textarea placeholder="Your Message" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Animation Script -->
  <script>
    // Reveal animations on scroll
    const revealElements = document.querySelectorAll('.reveal');
    
    function reveal() {
      for (let i = 0; i < revealElements.length; i++) {
        const windowHeight = window.innerHeight;
        const elementTop = revealElements[i].getBoundingClientRect().top;
        const elementVisible = 150;
        
        if (elementTop < windowHeight - elementVisible) {
          revealElements[i].classList.add("active");
        }
      }
    }
    
    window.addEventListener("scroll", reveal);
    window.addEventListener("load", reveal);
  </script>

  <!-- Load Navbar -->
  <script src="navbar-loader.js"></script>
</body>
</html>
