<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - FlexiDesk</title>
  <link rel="stylesheet" href="navbarStyle.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* ===== VARIABLES ===== */
    :root {
      /* Light mode colors */
      --primary-color: #0d2240;
      --secondary-color: #3d5af1;
      --accent-color: #22d1ee;
      --text-color: #1a1a1a;
      --background-color: #ffffff;
      --card-bg-light: #ffffff;
      --card-shadow: rgba(0, 0, 0, 0.04);
      --gradient-start: #3d5af1;
      --gradient-end: #22d1ee;
      --border-color: rgba(0, 0, 0, 0.08);
      --subtle-bg: #f8f9fa;
      --navbar-bg: rgba(255, 255, 255, 0.9);
      --navbar-text: #0d2240;
      --navbar-shadow: rgba(0, 0, 0, 0.05);
      --navbar-hover: #3d5af1;
      --navbar-active: #22d1ee;
      --button-bg: #3d5af1;
      --button-text: #ffffff;
      --button-hover: #0d2240;
    }
  
    /* Dark mode variables */
    .dark-mode {
      --primary-color: #22d1ee;
      --secondary-color: #3d5af1;
      --accent-color: #f5f5f5;
      --text-color: #f1f1f1;
      --background-color: #111111;
      --card-bg-light: #1a1a1a;
      --card-shadow: rgba(0, 0, 0, 0.25);
      --gradient-start: #3d5af1;
      --gradient-end: #22d1ee;
      --border-color: rgba(255, 255, 255, 0.1);
      --subtle-bg: #1e1e1e;
      --navbar-bg: rgba(17, 17, 17, 0.95);
      --navbar-text: #f1f1f1;
      --navbar-shadow: rgba(0, 0, 0, 0.3);
      --navbar-hover: #22d1ee;
      --navbar-active: #3d5af1;
      --button-bg: #22d1ee;
      --button-text: #111111;
      --button-hover: #3d5af1;
    }
    
    /* ===== PAGE-SPECIFIC STYLES ===== */
    main {
      padding: 150px 0 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    h1 {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
      width: 100%;
      letter-spacing: -0.03em;
      color: var(--primary-color);
    }

    h2 {
      font-size: 2.5rem;
      letter-spacing: -0.02em;
      color: var(--primary-color);
      margin-bottom: 1.5rem;
    }

    p {
      line-height: 1.8;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    /* ===== CONTACT SECTION ===== */
    .contact-card {
      background-color: var(--card-bg-light);
      border-radius: 15px;
      box-shadow: 0 10px 30px var(--card-shadow);
      border: 1px solid var(--border-color);
      padding: 50px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .contact-info {
      margin: 30px 0;
    }

    .contact-info p {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: var(--text-color);
    }

    .contact-info i {
      font-size: 1.5rem;
      color: var(--secondary-color);
      margin-right: 20px;
      width: 25px;
      text-align: center;
    }

    .contact-info a {
      color: var(--secondary-color);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .contact-info a:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    /* Contact Form */
    .contact-form {
      margin-top: 20px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      background-color: var(--background-color);
      color: var(--text-color);
      transition: all 0.3s ease;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(61, 90, 241, 0.2);
    }

    .contact-form textarea {
      min-height: 150px;
      resize: vertical;
    }

    .contact-form button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .contact-form button:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(61, 90, 241, 0.3);
    }

    /* ===== REVEAL ANIMATIONS ===== */
    .reveal {
      position: relative;
      opacity: 0;
      transform: translateY(50px);
      transition: all 1s cubic-bezier(0.5, 0, 0, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 { transition-delay: 0.1s; }
    .delay-2 { transition-delay: 0.2s; }
    .delay-3 { transition-delay: 0.3s; }

    /* ===== MEDIA QUERIES ===== */
    @media (max-width: 1200px) {
      .contact-card {
        padding: 40px;
      }
    }

    @media (max-width: 992px) {
      h1 {
        font-size: 2.5rem;
      }
    }
    
    @media (max-width: 768px) {
      main {
        padding: 100px 0 70px;
      }
      
      .contact-card {
        padding: 30px;
      }
      
      h1 {
        font-size: 2.2rem;
      }
    }

    @media (max-width: 576px) {
      .container {
        padding: 0 20px;
      }
      
      h1 {
        font-size: 2rem;
      }
    }

    /* Loading indicator for navbar */
    .navbar-loading {
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--navbar-bg);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      box-shadow: 0 4px 30px var(--navbar-shadow);
    }

    .loading-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(61, 90, 241, 0.3);
      border-radius: 50%;
      border-top-color: var(--secondary-color);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Placeholder with loading indicator -->
  <div id="navbar-placeholder" class="navbar-loading">
    <div class="loading-spinner"></div>
  </div>

  <!-- Main Content -->
  <main>
    <div class="container">
      <div class="contact-card reveal">
        <h1>Contact Us</h1>

        <div class="contact-info reveal delay-1">
          <p>
            <i class="fas fa-users"></i> <strong>Team Members:</strong> Salman
            Hassan, Ammar Abdo, Saud Al-Ruzaiqi, Abdulrahman Kateb, Abdulaziz
            Al-Shafee
          </p>
          <p>
            <i class="fas fa-envelope"></i> <strong>Email:</strong>
            <a href="mailto:FlexiDesk@hotmail.com">FlexiDesk@hotmail.com</a>
          </p>
          <p>
            <i class="fas fa-phone"></i> <strong>Phone:</strong> +966 5** ***
            ****
          </p>
        </div>

        <h2>Send us a message</h2>
        <form class="contact-form reveal delay-2">
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <textarea placeholder="Your Message" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    // Dark Mode Toggle Function (must be defined globally)
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      
      // Save preference to localStorage
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'enabled' : 'disabled');
      
      // Update icon based on dark mode state
      const toggleIcon = document.querySelector('.toggle-icon');
      if (toggleIcon) {
        toggleIcon.textContent = document.body.classList.contains('dark-mode') ? '🌙' : '☀️';
      }
      
      // Update toggle thumb position
      const toggleThumb = document.querySelector('.toggle-thumb');
      if (toggleThumb) {
        toggleThumb.style.left = document.body.classList.contains('dark-mode') ? '26px' : '2px';
      }
    }

    // Toggle mobile menu function
    function toggleMenu() {
      document.querySelector('.navbar').classList.toggle('menu-open');
    }
    
    // Profile dropdown function
    function profiledropdown() {
      const profileList = document.getElementById('profileList');
      if (profileList) {
        profileList.style.display = profileList.style.display === 'flex' ? 'none' : 'flex';
      }
    }

    // Initialize dark mode when page loads
    function initDarkMode() {
      if (localStorage.getItem('darkMode') === 'enabled') {
        document.body.classList.add('dark-mode');
      }
    }

    // Fetch and insert navbar
    fetch('navbar.php')
      .then((response) => response.text())
      .then((data) => {
        document.getElementById('navbar-placeholder').innerHTML = data;
        
        // After navbar is loaded, init dark mode again to ensure toggle icon is updated
        if (localStorage.getItem('darkMode') === 'enabled') {
          const toggleIcon = document.querySelector('.toggle-icon');
          if (toggleIcon) {
            toggleIcon.textContent = '🌙';
          }
          
          const toggleThumb = document.querySelector('.toggle-thumb');
          if (toggleThumb) {
            toggleThumb.style.left = '26px';
          }
        }
      })
      .catch((error) => {
        console.error('Error loading navbar:', error);
        // Remove loading indicator if navbar fails to load
        document.getElementById('navbar-placeholder').innerHTML = '';
        
        // Fallback static navbar
        const staticNavbar = `
        <nav class="navbar">
          <a href="homePage.php" class="logo">
            <h2 class="logo-text">FlexiDesk</h2>
          </a>
          
          <button class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
          </button>
          
          <div class="nav-links">
            <a href="homePage.php">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
            
            <div class="auth-buttons">
              <button class="auth-button login-btn" onclick="window.location.href='Login.html'">Log in</button>
              <button class="auth-button signup-btn" onclick="window.location.href='createAccount.html'">Sign up</button>
            </div>
          </div>
          
          <div class="dark-mode-container">
            <div class="dark-mode-toggle" id="dark-mode-switch" onclick="toggleDarkMode()">
              <div class="toggle-thumb">
                <i class="toggle-icon" id="theme-icon">☀️</i>
              </div>
            </div>
          </div>
        </nav>`;
        
        document.getElementById('navbar-placeholder').innerHTML = staticNavbar;
        
        // Initialize dark mode for fallback navbar as well
        if (localStorage.getItem('darkMode') === 'enabled') {
          const toggleIcon = document.querySelector('.toggle-icon');
          if (toggleIcon) {
            toggleIcon.textContent = '🌙';
          }
          
          const toggleThumb = document.querySelector('.toggle-thumb');
          if (toggleThumb) {
            toggleThumb.style.left = '26px';
          }
        }
      });
    
    // Reveal animations on scroll
    function reveal() {
      const reveals = document.querySelectorAll(".reveal");
      for (let i = 0; i < reveals.length; i++) {
        const windowHeight = window.innerHeight;
        const elementTop = reveals[i].getBoundingClientRect().top;
        const elementVisible = 150;
        
        if (elementTop < windowHeight - elementVisible) {
          reveals[i].classList.add("active");
        }
      }
    }
    
    // Document ready function
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize dark mode immediately on page load
      initDarkMode();
      
      // Initialize scroll animations
      reveal();
    });
    
    // Attach event listeners
    window.addEventListener("scroll", reveal);
    window.addEventListener("load", reveal);
    
    // Form submission handler (prevent default for demo)
    document.querySelector('.contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Thank you for your message. We will get back to you soon!');
      this.reset();
    });
  </script>
</body>
</html>
