<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexiDesk - Create Account</title>
    <link rel="stylesheet" href="navbarStyle.css" />
    <script src="script.js" defer></script>

    <style>
      /* General Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Arial', sans-serif;
      }

      body {
        background-color: #f5f5f5;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      body.dark-mode {
        background-color: #121212;
        color: #ffffff;
      }

      .container {
        margin-top: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      .form-container {
        background: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      body.dark-mode .form-container {
        background-color: #1e1e1e;
        color: #ffffff;
      }

      .form-title {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 2rem;
        font-size: 1.8rem;
        transition: color 0.3s ease;
      }

      body.dark-mode .form-title {
        color: #ffffff;
      }

      /* Floating Label Input Styles */
      .wave-group {
        position: relative;
        margin-top: 1.5rem;
        width: 100%;
      }

      .wave-group .input {
        font-size: 16px;
        padding: 10px 10px 10px 5px;
        display: block;
        width: 100%;
        border: none;
        border-bottom: 2px solid #515151;
        background: transparent;
        color: inherit;
      }

      .wave-group .input:focus {
        outline: none;
      }

      .wave-group .label {
        color: #999;
        font-size: 18px;
        position: absolute;
        pointer-events: none;
        left: 5px;
        top: 10px;
        transition: 0.2s ease all;
      }

      .wave-group .input:focus ~ .label,
      .wave-group .input:valid ~ .label {
        transform: translateY(-20px);
        font-size: 14px;
        color: #5264ae;
      }

      body.dark-mode .wave-group .label {
        color: #666;
      }

      /* Password Toggle Eye Icon */
      .password-container {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 1.2rem;
        color: #3498db;
      }

      .password-toggle:hover {
        opacity: 0.8;
      }

      /* Password Requirements */
      .password-requirements {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 1rem;
      }

      .password-requirements li {
        margin-bottom: 0.5rem;
      }

      .password-requirements li.valid {
        color: #27ae60;
      }

      .password-requirements li.invalid {
        color: #e74c3c;
      }

      .signin-section {
        text-align: center;
        margin-top: 2rem;
      }

      .signin-text {
        color: var(--text-color);
        margin-bottom: 1rem;
      }

      .signin-btn {
        background-color: #2c3e50;
        color: white;
        text-decoration: none;
        padding: 10px 30px;
        border-radius: 5px;
        transition: all 0.3s ease;
      }

      .signup-btn:hover {
        background-color: #34495e;
      }

      /* Button */
      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .btn:hover {
              opacity: 0.9;
              transform: translateY(-2px);
            }


      .create-account-btn {
        background-color: #3498db;
        color: white;
      }


      .popup {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(4px);
      }

      .popup-content {
        background: white;
        width: 400px;
        padding: 0;
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        border-radius: 4px;
        border: 2px solid #e0e5f2;
      }

      .popup-content h2 {
        background-color: #e0e5f2;
        color: black;
        padding: 12px;
        font-size: 16px;
        margin: 0;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: default;
      }

      .popup-btn {
        background-color: #2c3e50;
        color: white;
        padding: 10px 20px;
        font-weight: bold;
        border: none;
        border-radius: 5px;
        width: 100%;
        cursor: pointer;
        text-align: center;
        transition: all 0.3s ease;
      }

      .popup-btn:hover {
        background-color: #34495e;
        transform: translateY(-2px);
        opacity: 0.9;
      }

      .popup-btn.cancel {
        background-color: #888;
      }

      .popup-btn.cancel:hover {
        background-color: #777;
      }

      .addTask-close-btn {
        position: absolute;
        top: 8px;
        right: 12px;
        font-size: 22px;
        color: #444;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s ease;
      }
      .addTask-close-btn:hover {
        color: #e74c3c;
      }

    </style>
  </head>
  <body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <div class="container">
      <div class="form-container">
        <h2 class="form-title">Create Account</h2>
        <!-- Form submits data to createAccount.php -->
        <form id="signup-form" method="POST" action="createAccount.php">
          <div class="wave-group">
            <input type="text" id="first-name" name="first-name" class="input" required />
            <label class="label">First Name</label>
          </div>

          <div class="wave-group">
            <input type="text" id="last-name" name="last-name" class="input" required />
            <label class="label">Last Name</label>
          </div>

          <div class="wave-group">
            <input type="email" id="email" name="email" class="input" required />
            <label class="label">Email</label>
          </div>
          <small id="email-error" style="color: red; display: none;">Email is already registered.</small>

          <div class="password-container wave-group">
            <input type="password" id="password" name="password" class="input" required />
            <label class="label">Password</label>
            <span
              class="password-toggle"
              onclick="togglePasswordVisibility('password', this)"
              >👁️</span
            >
          </div>

          <div class="password-container wave-group">
            <input
              type="password" id="confirm-password" name="confirm-password" class="input" required />
            <label class="label">Re-enter Password</label>
            <span
              class="password-toggle"
              onclick="togglePasswordVisibility('confirm-password', this)"
              >👁️</span
            >
          </div>
          <small id="password-match-error" style="color: red; display: none; ">
            Passwords do not match.
          </small>
          

          <div class="password-requirements">
            <p style="margin-top: 1.5rem;">Password must contain:</p>
            <ul>
              <li id="length" >At least 8 characters</li>
              <li id="lowercase" >A lowercase letter</li>
              <li id="uppercase" >An uppercase letter</li>
              <li id="number" >A number</li>
              <li id="special" >A special character ( !@#$%^&*(),.?":{}|<> )</li>
            </ul>
          </div>

          <div class="wave-group">
            <input list="job-title-list" id="job-title" name="job-title" class="input" required />
            <label class="label">Job Title</label>
            <datalist id="job-title-list">
              <!-- Options will be populated by JS -->
            </datalist>
          </div>
          
          <div class="wave-group">
            <input list="department-list" id="department" name="department" class="input" required />
            <label class="label">Department</label>
            <datalist id="department-list">
              <!-- Options will be populated by JS -->
            </datalist>
          </div>          
          
          <div class="wave-group">
            <textarea id="bio" name="bio" class="input" rows="4" required></textarea>
            <label class="label">Short Bio</label>
          </div>

          
          <button type="submit" style="margin-top: 1.5rem;" class="btn create-account-btn">
            Create Account
          </button>
        </form>

        <div id="verificationPopup" class="popup">
          <div class="popup-content" style="width: 400px; position: relative;">
            <h2 class="popup-header">Email Verification</h2>
        
            <span class="addTask-close-btn" onclick="closeVerificationPopup()"
                  style="position: absolute; top: 10px; right: 12px; font-size: 20px; cursor: pointer;">&times;</span>
        
            <div style="padding: 20px;">
              <div class="wave-group">
                <input type="text" id="verificationCodeInput" class="input" maxlength="6" required />
                <label class="label">6-digit Code</label>
              </div>
        
              <div class="button-container" style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="closeVerificationPopup()" class="popup-btn cancel">Cancel</button>
                <button onclick="verifyEmailCode()" class="popup-btn">Verify</button>
              </div>
        
              <div style="text-align: center; margin-top: 15px;">
                <button onclick="resendVerificationCode()" style="background: none; border: none; color: #3498db; cursor: pointer;">
                  Resend Code
                </button>
              </div>
            </div>
          </div>
        </div>
        

    <script>
      // Fetch and insert navbar
      fetch('navbar.php')
        .then((response) => response.text())
        .then((data) => {
          document.getElementById('navbar-placeholder').innerHTML = data;
        })
        .catch((error) => console.error('Error loading navbar:', error));
     
      // Password Toggle
      function togglePasswordVisibility(inputId, icon) {
        const input = document.getElementById(inputId);
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.textContent = input.type === 'password' ? '👁️' : '🙈';
      }
      
      // Password Validation
      const passwordInput = document.getElementById('password');
      const requirements = {
        length: document.getElementById('length'),
        lowercase: document.getElementById('lowercase'),
        uppercase: document.getElementById('uppercase'),
        number: document.getElementById('number'),
        special: document.getElementById('special'),
      };

      passwordInput.addEventListener('input', () => {
        const password = passwordInput.value;

        requirements.length.classList.toggle('valid', password.length >= 8);
        requirements.length.classList.toggle('invalid', password.length < 8);

        requirements.lowercase.classList.toggle('valid', /[a-z]/.test(password));
        requirements.lowercase.classList.toggle('invalid', !/[a-z]/.test(password));

        requirements.uppercase.classList.toggle('valid', /[A-Z]/.test(password));
        requirements.uppercase.classList.toggle('invalid', !/[A-Z]/.test(password));

        requirements.number.classList.toggle('valid', /\d/.test(password));
        requirements.number.classList.toggle('invalid', !/\d/.test(password));

        requirements.special.classList.toggle('valid', /[!@#$%^&*(),.?":{}|<>]/.test(password));
        requirements.special.classList.toggle('invalid', !/[!@#$%^&*(),.?":{}|<>]/.test(password));
      });


      // Form submission with email check
      document.getElementById('signup-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const passwordError = document.getElementById('password-match-error');

        if (password !== confirmPassword) {
          passwordError.style.display = 'inline';
          return; // stop form submission
        } else {
          passwordError.style.display = 'none';
        }
        
        const email = document.getElementById('email').value;

        fetch('check_email.php', {
          method: 'POST',
          body: JSON.stringify({ email }),
          headers: { 'Content-Type': 'application/json' },
        })
        .then(response => response.json())
        .then(data => {
          if (data.exists) {
            document.getElementById('email-error').style.display = 'inline';
          } else {
            const department = document.getElementById('department').value;
            fetch('addMetaValueIfNew.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'JobTitle', value: document.getElementById('job-title').value })
            });
            fetch('addMetaValueIfNew.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'Department', value: department })
            });

            fetch('sendVerificationCode.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, purpose: 'signup' })
            })
            .then(res => res.json())
            .then(res => {
              console.log("SERVER RESPONSE:", res); 
              if (res.status === 'success') {
                showVerificationPopup();
              } else {
                alert('Failed to send verification code.\n' + (res.message || ''));
              }
            })
            .catch(err => {
              console.error('Fetch failed:', err);
              alert('Could not reach the server.');
            });
          }
        });
      });

      // Load job titles from MetaValues
      fetch('getMetaValues.php?type=JobTitle')
        .then(res => res.json())
        .then(data => {
          const jobList = document.getElementById('job-title-list');
          jobList.innerHTML = data.map(job => `<option value="${job}">`).join('');
        });

      // Load departments from MetaValues
      fetch('getMetaValues.php?type=Department')
        .then(res => res.json())
        .then(data => {
          const deptList = document.getElementById('department-list');
          deptList.innerHTML = data.map(dep => `<option value="${dep}">`).join('');
        });

        function verifyEmailCode() {
          const code = document.getElementById('verificationCodeInput').value;
          if (!code) return alert("Please enter the code");

          fetch('verifyCodeOnly.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code })
          })
          .then(async res => {
            const text = await res.text();
            try {
              const data = JSON.parse(text);
              console.log(data); // Optional: Debug
              if (data.status === 'success') {
                closeVerificationPopup();
                document.getElementById('signup-form').submit();
              } else {
                alert(data.message);
              }
            } catch (err) {
              console.error('JSON Parse Error:', err);
              console.error('Raw response:', text);
              alert('Unexpected server error:\n' + text);
            }
          });
        }


        function showVerificationPopup() {
          document.getElementById('verificationPopup').style.display = 'block';
        }
        function closeVerificationPopup() {
          document.getElementById('verificationPopup').style.display = 'none';
        }

        function resendVerificationCode() {
          const email = document.getElementById('email').value;
          if (!email) {
            alert("Email is required to resend the code.");
            return;
          }

          fetch('sendVerificationCode.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
          })
          .then(res => res.json())
          .then(res => {
            if (res.status === 'success') {
              alert("Verification code resent successfully.");
            } else {
              alert("Failed to resend code.\n" + (res.message || ''));
            }
          })
          .catch(err => {
            console.error('Resend error:', err);
            alert("Something went wrong.");
          });
        }

        document.getElementById('confirm-password').addEventListener('focus', () => {
          document.getElementById('password-match-error').style.display = 'none';
        });

        document.getElementById('email').addEventListener('focus', () => {
          document.getElementById('email-error').style.display = 'none'; 
        });

    </script>
  </body>
</html>
