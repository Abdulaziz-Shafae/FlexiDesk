<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexiDesk - Create Account</title>
    <link rel="stylesheet" href="navbarStyle.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
      /* ===== VARIABLES ===== */
      :root {
        /* Light mode colors */
        --primary-color: #0d2240;
        --secondary-color: #3d5af1;
        --accent-color: #22d1ee;
        --text-color: #1a1a1a;
        --background-color: #f4f4f4;
        --card-bg-light: #ffffff;
        --card-shadow: rgba(0, 0, 0, 0.08);
        --gradient-start: #3d5af1;
        --gradient-end: #22d1ee;
        --border-color: rgba(0, 0, 0, 0.08);
        --subtle-bg: #f8f9fa;
        --navbar-bg: rgba(255, 255, 255, 0.9);
        --navbar-text: #0d2240;
        --navbar-shadow: rgba(0, 0, 0, 0.05);
        --navbar-hover: #3d5af1;
        --navbar-active: #22d1ee;
        --button-bg: #3d5af1;
        --button-text: #ffffff;
        --button-hover: #0d2240;
        --signup-btn-bg: #3d5af1;
        --signup-btn-text: #ffffff;
        --signup-btn-hover: #274ad9;
        --input-border: #515151;
        --input-bg: transparent;
        --error-bg: #ffe6e6;
        --error-text: #e74c3c;
        --success-text: #27ae60;
        --link-color: #3498db;
        --popup-btn-bg: linear-gradient(135deg, #3d5af1, #22d1ee);
        --popup-btn-hover-bg: linear-gradient(135deg, #274ad9, #1bb8d3);
        --popup-cancel-btn-bg: #f1f1f1;
        --popup-cancel-btn-text: #333333;
        --popup-cancel-btn-hover-bg: #e1e1e1;
      }

      /* Dark mode variables */
      .dark-mode {
        --primary-color: #22d1ee;
        --secondary-color: #3d5af1;
        --accent-color: #f5f5f5;
        --text-color: #f1f1f1;
        --background-color: #111111;
        --card-bg-light: #1a1a1a;
        --card-shadow: rgba(0, 0, 0, 0.25);
        --gradient-start: #3d5af1;
        --gradient-end: #22d1ee;
        --border-color: rgba(255, 255, 255, 0.1);
        --subtle-bg: #1e1e1e;
        --navbar-bg: rgba(17, 17, 17, 0.95);
        --navbar-text: #f1f1f1;
        --navbar-shadow: rgba(0, 0, 0, 0.3);
        --navbar-hover: #22d1ee;
        --navbar-active: #3d5af1;
        --button-bg: #22d1ee;
        --button-text: #111111;
        --button-hover: #3d5af1;
        --signup-btn-bg: #22d1ee;
        --signup-btn-text: #111111;
        --signup-btn-hover: #1bb8d3;
        --input-border: #f1f1f1;
        --input-bg: #333;
        --error-bg: #5a2828;
        --error-text: #ff6b6b;
        --success-text: #6aeda8;
        --link-color: #4dabf7;
        --popup-btn-bg: linear-gradient(135deg, #22d1ee, #3d5af1);
        --popup-btn-hover-bg: linear-gradient(135deg, #1bb8d3, #274ad9);
        --popup-cancel-btn-bg: #2c2c2c;
        --popup-cancel-btn-text: #f1f1f1;
        --popup-cancel-btn-hover-bg: #3c3c3c;
      }
      
      /* ===== NAVBAR STYLES - Matching homePage.php ===== */
      /* Logo styling and hover effect */
      .logo {
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
        padding: 8px 0;
        margin-top: 12px;
      }

      .logo .logo-text {
        font-size: 2.5rem;
        font-weight: 700;
        color: #4169E1 !important; 
        letter-spacing: -0.03em;
        transition: color 0.3s ease, transform 0.3s ease;
      }

      .logo:hover .logo-text {
        color: #3d5af1 !important;
        transform: translateY(-2px);
      }

      /* Add underline effect to logo */
      .logo::after {
        content: '';
        position: absolute;
        bottom: 20px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, #3d5af1, #22d1ee);
        transition: width 0.3s ease;
        border-radius: 2px;
      }

      .logo:hover::after {
        width: 100%;
      }

      .dark-mode .logo .logo-text {
        color: #3d5af1 !important;
      }

      .dark-mode .logo:hover .logo-text {
        color: #22d1ee !important;
      }

      /* Hide the logo icon */
      .logo-icon {
        display: none;
      }

      /* Navigation Links */
      .nav-links {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .nav-links a {
        position: relative;
        padding: 8px 16px;
        color: var(--navbar-text);
        text-decoration: none;
        font-weight: 500;
        font-size: 1rem;
        transition: all 0.3s ease;
        border-radius: 6px;
        overflow: hidden;
      }

      .nav-links a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, #3d5af1, #22d1ee);
        transition: width 0.3s ease;
        border-radius: 2px;
      }

      .nav-links a:hover {
        color: var(--navbar-hover);
        background-color: transparent;
      }

      .nav-links a:hover::after {
        width: 100%;
      }

      .nav-links a.active {
        color: var(--navbar-active);
        font-weight: 600;
      }

      .nav-links a.active::after {
        width: 100%;
      }

      /* Auth Buttons */
      .auth-button {
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .login-btn:hover {
        background-color: rgba(61, 90, 241, 0.1);
        border-color: var(--navbar-hover);
        color: var(--navbar-hover);
        transform: translateY(-3px);
      }

      .signup-btn:hover {
        background-color: var(--button-hover);
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 8px 25px rgba(61, 90, 241, 0.3);
      }

      /* Dark mode toggle */
      .dark-mode-toggle {
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .dark-mode-toggle:hover {
        transform: scale(1.1);
      }

      .toggle-thumb {
        transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      }

      /* ===== FORM CONTAINER ===== */
      .container {
        margin-top: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: calc(100vh - 120px);
        padding: 20px;
      }

      .form-container {
        background: var(--card-bg-light);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px var(--card-shadow);
        width: 100%;
        max-width: 500px;
        border: 1px solid var(--border-color);
        transition: all 0.3s ease;
        margin-bottom: 40px;
      }

      .form-title {
        font-size: 2rem;
        color: var(--primary-color);
        margin-bottom: 2rem;
        text-align: center;
        font-weight: 700;
      }

      /* ===== FORM FIELDS ===== */
      .wave-group {
        position: relative;
        margin-bottom: 1.5rem;
        width: 100%;
      }

      .wave-group .input {
        font-size: 16px;
        padding: 12px 10px 8px 5px;
        display: block;
        width: 100%;
        border: none;
        border-bottom: 2px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text-color);
        transition: all 0.3s ease;
      }

      .wave-group .input:focus {
        outline: none;
        border-bottom-color: var(--secondary-color);
      }

      .wave-group .label {
        color: var(--text-color);
        opacity: 0.7;
        font-size: 18px;
        position: absolute;
        pointer-events: none;
        left: 5px;
        top: 12px;
        transition: 0.3s ease all;
      }

      .wave-group .input:focus ~ .label,
      .wave-group .input:valid ~ .label {
        transform: translateY(-22px);
        font-size: 14px;
        color: var(--accent-color);
        opacity: 1;
      }

      /* Special styling for textarea */
      .wave-group textarea.input {
        min-height: 100px;
        resize: vertical;
      }

      /* Error Messages */
      .error-message {
        color: var(--error-text);
        font-size: 0.85rem;
        margin-top: 5px;
        display: none;
      }

      /* ===== PASSWORD FIELDS ===== */
      .password-container {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 1.2rem;
        color: var(--secondary-color);
        z-index: 2;
      }

      .password-toggle:hover {
        color: var(--accent-color);
      }

      /* Password Requirements */
      .password-requirements {
        font-size: 0.9rem;
        color: var(--text-color);
        opacity: 0.8;
        margin: 1.5rem 0;
        background-color: var(--subtle-bg);
        padding: 15px;
        border-radius: 8px;
      }

      .password-requirements ul {
        margin-top: 0.5rem;
        padding-left: 20px;
      }

      .password-requirements li {
        margin-bottom: 0.5rem;
        transition: all 0.3s ease;
      }

      .password-requirements li.valid {
        color: var(--success-text);
      }

      .password-requirements li.invalid {
        color: var(--error-text);
      }

      /* ===== BUTTONS ===== */
      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 1.5rem;
      }

      .create-account-btn {
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        color: white;
        box-shadow: 0 4px 15px rgba(61, 90, 241, 0.25);
      }

      .create-account-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(61, 90, 241, 0.3);
      }

      /* ===== POPUP STYLING ===== */
      .popup {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
        z-index: 1000;
      }

      .popup-content {
        background: var(--card-bg-light);
        width: 400px;
        max-width: 90%;
        box-shadow: 0 15px 35px var(--card-shadow);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        border-radius: 15px;
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      .popup-header {
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        color: white;
        padding: 15px 20px;
        font-size: 1.2rem;
        margin: 0;
        text-align: center;
        font-weight: 600;
      }

      .popup-body {
        padding: 25px;
      }

      .addTask-close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 22px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .addTask-close-btn:hover {
        transform: scale(1.2);
      }

      .popup-btn {
        background: var(--popup-btn-bg);
        color: white;
        padding: 12px 20px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        width: 100%;
        cursor: pointer;
        text-align: center;
        transition: all 0.3s ease;
        margin-top: 15px;
      }

      .popup-btn:hover {
        background: var(--popup-btn-hover-bg);
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(61, 90, 241, 0.3);
      }

      .popup-btn.cancel {
        background: var(--popup-cancel-btn-bg);
        color: var(--popup-cancel-btn-text);
        box-shadow: none;
      }

      .popup-btn.cancel:hover {
        background: var(--popup-cancel-btn-hover-bg);
        transform: translateY(-2px);
      }

      .button-container {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .resend-code-btn {
        background: none;
        border: none;
        color: var(--link-color);
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        text-decoration: underline;
        margin-top: 15px;
      }

      .resend-code-btn:hover {
        color: var(--accent-color);
      }

      /* ===== RESPONSIVE STYLES ===== */
      @media (max-width: 768px) {
        .container {
          margin-top: 100px;
        }
        
        .form-container {
          padding: 30px;
        }
        
        .form-title {
          font-size: 1.8rem;
        }
        
        .button-container {
          flex-direction: column;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 15px;
        }
        
        .form-container {
          padding: 25px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar - Matched to homePage.php but using HTML-only -->
    <nav class="navbar">
      <!-- Logo -->
      <a href="homePage.php" class="logo">
        <h2 class="logo-text">FlexiDesk</h2>
      </a>
      
      <!-- Mobile Menu Toggle Button -->
      <button class="menu-toggle" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <div class="nav-links">
        <!-- Navigation Links -->
        <a href="homePage.php">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        
        <!-- Auth Buttons (Signup is active) -->
        <div class="auth-buttons">
          <button class="auth-button login-btn" onclick="window.location.href='Login.html'">Log in</button>
          <button class="auth-button signup-btn" onclick="window.location.href='createAccount.html'" style="opacity: 0.8;">Sign up</button>
        </div>
      </div>
      
      <!-- Dark Mode Toggle -->
      <div class="dark-mode-container">
        <div class="dark-mode-toggle" id="dark-mode-switch" onclick="toggleDarkMode()">
          <div class="toggle-thumb">
            <i class="toggle-icon" id="theme-icon">☀️</i>
          </div>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="form-container">
        <h2 class="form-title">Create Account</h2>
        
        <!-- Form submits data to createAccount.php -->
        <form id="signup-form" method="POST" action="createAccount.php">
          <div class="wave-group">
            <input type="text" id="first-name" name="first-name" class="input" required />
            <label class="label">First Name</label>
          </div>

          <div class="wave-group">
            <input type="text" id="last-name" name="last-name" class="input" required />
            <label class="label">Last Name</label>
          </div>

          <div class="wave-group">
            <input type="email" id="email" name="email" class="input" required />
            <label class="label">Email</label>
            <small id="email-error" class="error-message">Email is already registered.</small>
          </div>

          <div class="password-container wave-group">
            <input type="password" id="password" name="password" class="input" required />
            <label class="label">Password</label>
            <span
              class="password-toggle"
              onclick="togglePasswordVisibility('password', this)">👁️
            </span>
          </div>

          <div class="password-container wave-group">
            <input
              type="password" id="confirm-password" name="confirm-password" class="input" required />
            <label class="label">Re-enter Password</label>
            <span
              class="password-toggle"
              onclick="togglePasswordVisibility('confirm-password', this)">👁️</span>
            <small id="password-match-error" class="error-message">Passwords do not match.</small>
          </div>
          
          <div class="password-requirements">
            <p>Password must contain:</p>
            <ul>
              <li id="length">At least 8 characters</li>
              <li id="lowercase">A lowercase letter</li>
              <li id="uppercase">An uppercase letter</li>
              <li id="number">A number</li>
              <li id="special">A special character ( !@#$%^&*(),.?":{}|<> )</li>
            </ul>
          </div>

          <div class="wave-group">
            <input list="job-title-list" id="job-title" name="job-title" class="input" required />
            <label class="label">Job Title</label>
            <datalist id="job-title-list">
              <!-- Options will be populated by JS -->
            </datalist>
          </div>
          
          <div class="wave-group">
            <input list="department-list" id="department" name="department" class="input" required />
            <label class="label">Department</label>
            <datalist id="department-list">
              <!-- Options will be populated by JS -->
            </datalist>
          </div>          
          
          <div class="wave-group">
            <textarea id="bio" name="bio" class="input" rows="4" required></textarea>
            <label class="label">Short Bio</label>
          </div>

          <button type="submit" class="btn create-account-btn">
            Create Account
          </button>
        </form>

        <!-- Verification Popup -->
        <div id="verificationPopup" class="popup">
          <div class="popup-content">
            <h2 class="popup-header">Email Verification</h2>
            <span class="addTask-close-btn" onclick="closeVerificationPopup()">&times;</span>
        
            <div class="popup-body">
              <div class="wave-group">
                <input type="text" id="verificationCodeInput" class="input" maxlength="6" required />
                <label class="label">6-digit Code</label>
              </div>
        
              <div class="button-container">
                <button onclick="closeVerificationPopup()" class="popup-btn cancel">Cancel</button>
                <button onclick="verifyEmailCode()" class="popup-btn">Verify</button>
              </div>
        
              <div style="text-align: center; margin-top: 15px;">
                <button onclick="resendVerificationCode()" class="resend-code-btn">
                  Resend Code
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Mobile menu toggle function
      function toggleMenu() {
        document.querySelector('.navbar').classList.toggle('menu-open');
      }
      
      // Dark Mode Toggle Function
      function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        
        // Save preference to localStorage
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'enabled' : 'disabled');
        
        // Update icon based on dark mode state
        const toggleIcon = document.getElementById('theme-icon');
        if (toggleIcon) {
          toggleIcon.textContent = document.body.classList.contains('dark-mode') ? '🌙' : '☀️';
        }
        
        // Update toggle thumb position
        const toggleThumb = document.querySelector('.toggle-thumb');
        if (toggleThumb) {
          toggleThumb.style.left = document.body.classList.contains('dark-mode') ? '26px' : '2px';
        }
      }
      
      // Password Toggle
      function togglePasswordVisibility(inputId, icon) {
        const input = document.getElementById(inputId);
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.textContent = input.type === 'password' ? '👁️' : '🙈';
      }
      
      // Password Validation
      const passwordInput = document.getElementById('password');
      const requirements = {
        length: document.getElementById('length'),
        lowercase: document.getElementById('lowercase'),
        uppercase: document.getElementById('uppercase'),
        number: document.getElementById('number'),
        special: document.getElementById('special'),
      };

      passwordInput.addEventListener('input', () => {
        const password = passwordInput.value;

        requirements.length.classList.toggle('valid', password.length >= 8);
        requirements.length.classList.toggle('invalid', password.length < 8);

        requirements.lowercase.classList.toggle('valid', /[a-z]/.test(password));
        requirements.lowercase.classList.toggle('invalid', !/[a-z]/.test(password));

        requirements.uppercase.classList.toggle('valid', /[A-Z]/.test(password));
        requirements.uppercase.classList.toggle('invalid', !/[A-Z]/.test(password));

        requirements.number.classList.toggle('valid', /\d/.test(password));
        requirements.number.classList.toggle('invalid', !/\d/.test(password));

        requirements.special.classList.toggle('valid', /[!@#$%^&*(),.?":{}|<>]/.test(password));
        requirements.special.classList.toggle('invalid', !/[!@#$%^&*(),.?":{}|<>]/.test(password));
      });

      // Form submission with email check
      document.getElementById('signup-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const passwordError = document.getElementById('password-match-error');

        if (password !== confirmPassword) {
          passwordError.style.display = 'block';
          return; // stop form submission
        } else {
          passwordError.style.display = 'none';
        }
        
        const email = document.getElementById('email').value;

        fetch('check_email.php', {
          method: 'POST',
          body: JSON.stringify({ email }),
          headers: { 'Content-Type': 'application/json' },
        })
        .then(response => response.json())
        .then(data => {
          if (data.exists) {
            document.getElementById('email-error').style.display = 'block';
          } else {
            const department = document.getElementById('department').value;
            fetch('addMetaValueIfNew.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'JobTitle', value: document.getElementById('job-title').value })
            });
            fetch('addMetaValueIfNew.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'Department', value: department })
            });

            fetch('sendVerificationCode.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, purpose: 'signup' })
            })
            .then(res => res.json())
            .then(res => {
              console.log("SERVER RESPONSE:", res); 
              if (res.status === 'success') {
                showVerificationPopup();
              } else {
                alert('Failed to send verification code.\n' + (res.message || ''));
              }
            })
            .catch(err => {
              console.error('Fetch failed:', err);
              alert('Could not reach the server.');
            });
          }
        });
      });

      // Load job titles from MetaValues
      fetch('getMetaValues.php?type=JobTitle')
        .then(res => res.json())
        .then(data => {
          const jobList = document.getElementById('job-title-list');
          jobList.innerHTML = data.map(job => `<option value="${job}">`).join('');
        });

      // Load departments from MetaValues
      fetch('getMetaValues.php?type=Department')
        .then(res => res.json())
        .then(data => {
          const deptList = document.getElementById('department-list');
          deptList.innerHTML = data.map(dep => `<option value="${dep}">`).join('');
        });

      function verifyEmailCode() {
        const code = document.getElementById('verificationCodeInput').value;
        if (!code) return alert("Please enter the code");

        fetch('verifyCodeOnly.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        })
        .then(async res => {
          const text = await res.text();
          try {
            const data = JSON.parse(text);
            console.log(data); // Optional: Debug
            if (data.status === 'success') {
              closeVerificationPopup();
              document.getElementById('signup-form').submit();
            } else {
              alert(data.message);
            }
          } catch (err) {
            console.error('JSON Parse Error:', err);
            console.error('Raw response:', text);
            alert('Unexpected server error:\n' + text);
          }
        });
      }

      function showVerificationPopup() {
        document.getElementById('verificationPopup').style.display = 'block';
      }
      
      function closeVerificationPopup() {
        document.getElementById('verificationPopup').style.display = 'none';
      }

      function resendVerificationCode() {
        const email = document.getElementById('email').value;
        if (!email) {
          alert("Email is required to resend the code.");
          return;
        }

        fetch('sendVerificationCode.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            alert("Verification code resent successfully.");
          } else {
            alert("Failed to resend code.\n" + (res.message || ''));
          }
        })
        .catch(err => {
          console.error('Resend error:', err);
          alert("Something went wrong.");
        });
      }

      document.getElementById('confirm-password').addEventListener('focus', () => {
        document.getElementById('password-match-error').style.display = 'none';
      });

      document.getElementById('email').addEventListener('focus', () => {
        document.getElementById('email-error').style.display = 'none'; 
      });

      // Document ready - Apply dark mode if set in localStorage
      document.addEventListener('DOMContentLoaded', function() {
        if (localStorage.getItem('darkMode') === 'enabled') {
          document.body.classList.add('dark-mode');
          const toggleIcon = document.getElementById('theme-icon');
          if (toggleIcon) {
            toggleIcon.textContent = '🌙';
          }
          
          // Update toggle thumb position
          const toggleThumb = document.querySelector('.toggle-thumb');
          if (toggleThumb) {
            toggleThumb.style.left = '26px';
          }
        }
      });
    </script>
  </body>
</html>
