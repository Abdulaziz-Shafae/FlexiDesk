<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexiDesk - Create Project</title>
    <link rel="stylesheet" href="navbarStyle.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="script.js" defer></script>

    <style>
      /* ===== VARIABLES ===== */
      :root {
        /* Light mode colors */
        --primary-color: #0d2240;
        --secondary-color: #3d5af1;
        --accent-color: #22d1ee;
        --text-color: #1a1a1a;
        --background-color: #f4f4f4;
        --card-bg-light: #ffffff;
        --card-shadow: rgba(0, 0, 0, 0.08);
        --gradient-start: #3d5af1;
        --gradient-end: #22d1ee;
        --border-color: rgba(0, 0, 0, 0.08);
        --subtle-bg: #f8f9fa;
        --navbar-bg: rgba(255, 255, 255, 0.9);
        --navbar-text: #0d2240;
        --navbar-shadow: rgba(0, 0, 0, 0.05);
        --navbar-hover: #3d5af1;
        --navbar-active: #22d1ee;
        --button-bg: #3d5af1;
        --button-text: #ffffff;
        --button-hover: #0d2240;
        --error-text: #e74c3c;
        --success-color: #28a745;
        --error-color: #dc3545;
        --warning-color: #ffc107;
      }

      /* Dark mode variables */
      .dark-mode {
        --primary-color: #22d1ee;
        --secondary-color: #3d5af1;
        --accent-color: #f5f5f5;
        --text-color: #f1f1f1;
        --background-color: #111111;
        --card-bg-light: #1a1a1a;
        --card-shadow: rgba(0, 0, 0, 0.25);
        --gradient-start: #3d5af1;
        --gradient-end: #22d1ee;
        --border-color: rgba(255, 255, 255, 0.1);
        --subtle-bg: #1e1e1e;
        --navbar-bg: rgba(17, 17, 17, 0.95);
        --navbar-text: #f1f1f1;
        --navbar-shadow: rgba(0, 0, 0, 0.3);
        --navbar-hover: #22d1ee;
        --navbar-active: #3d5af1;
        --button-bg: #22d1ee;
        --button-text: #111111;
        --button-hover: #3d5af1;
        --error-text: #ff6b6b;
        --success-color: #2ea043;
        --error-color: #f85149;
        --warning-color: #d29922;
      }

      /* Success Popup */
      .success-popup {
        position: fixed;
        top: 120px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        width: 80%;
        max-width: 500px;
        background-color: #01cc1c;
        color: white;
        padding: 15px 20px;
        text-align: center;
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-weight: 600;
        animation: fadeInOut 5s forwards;
        display: none;
      }
      
      @keyframes fadeInOut {
        0% { opacity: 0; transform: translate(-50%, -20px); }
        10% { opacity: 1; transform: translate(-50%, 0); }
        80% { opacity: 1; transform: translate(-50%, 0); }
        100% { opacity: 0; transform: translate(-50%, -20px); visibility: hidden; }
      }

      .success-popup i {
        font-size: 24px;
      }

      .success-popup-close {
        position: absolute;
        right: 15px;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.2s;
        font-size: 18px;
      }

      .success-popup-close:hover {
        opacity: 1;
      }

      body {
        font-family: 'Inter', 'Arial', sans-serif;
        background-color: var(--background-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        transition: all 0.3s ease;
        line-height: 1.6;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 120px;
        padding-bottom: 60px;
      }

      .form-container {
        background-color: var(--card-bg-light);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px var(--card-shadow);
        width: 90%;
        max-width: 600px;
        border: 1px solid var(--border-color);
        transition: all 0.3s ease;
      }

      .form-title {
        font-size: 2rem;
        color: var(--primary-color);
        margin-bottom: 30px;
        text-align: center;
        font-weight: 700;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 15px;
      }

      .form-section {
        margin-bottom: 30px;
      }

      .form-section-title {
        font-size: 1.2rem;
        color: var(--primary-color);
        margin-bottom: 15px;
        font-weight: 600;
      }

      .wave-group {
        position: relative;
        margin-bottom: 25px;
        width: 100%;
      }

      .wave-group .input {
        font-size: 16px;
        padding: 12px 10px 8px 5px;
        display: block;
        width: 100%;
        border: none;
        border-bottom: 2px solid var(--border-color);
        background-color: var(--card-bg-light);
        color: var(--text-color);
        transition: all 0.3s ease;
      }

      .wave-group .input:focus {
        outline: none;
        border-bottom-color: var(--secondary-color);
      }

      .wave-group .label {
        color: var(--text-color);
        opacity: 0.7;
        font-size: 18px;
        position: absolute;
        pointer-events: none;
        left: 5px;
        top: 12px;
        transition: 0.3s ease all;
      }

      .wave-group input[type="date"] ~ .label,
      .wave-group .input:focus ~ .label,
      .wave-group .input:valid ~ .label {
        transform: translateY(-22px);
        font-size: 14px;
        color: var(--accent-color);
        opacity: 1;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(61, 90, 241, 0.25);
        margin-top: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(61, 90, 241, 0.3);
      }

      .btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      textarea.input {
        resize: vertical;
        min-height: 100px;
        font-family: inherit;
      }

      .user-search-container {
        position: relative;
        margin-bottom: 30px;
      }

      .search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-color);
        opacity: 0.5;
      }

      .user-search-input {
        width: 100%;
        padding: 12px 12px 12px 35px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 16px;
        background-color: var(--card-bg-light);
        color: var(--text-color);
        transition: all 0.3s ease;
      }

      .user-search-input:focus {
        outline: none;
        border-color: var(--secondary-color);
        box-shadow: 0 0 0 3px rgba(61, 90, 241, 0.1);
      }

      .suggestions {
        background-color: var(--card-bg-light);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        max-height: 200px;
        overflow-y: auto;
        position: absolute;
        z-index: 1000;
        width: 100%;
        box-shadow: 0 5px 15px var(--card-shadow);
        margin-top: 5px;
        display: none;
      }

      .suggestions.active {
        display: block;
      }

      .suggestion-item {
        padding: 10px 15px;
        cursor: pointer;
        color: var(--text-color);
        transition: background-color 0.2s ease;
        display: flex;
        align-items: center;
      }

      .suggestion-item:hover {
        background-color: var(--subtle-bg);
      }

      .suggestion-item .user-avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background-color: var(--secondary-color);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 10px;
        font-weight: bold;
      }

      .no-results {
        padding: 15px;
        text-align: center;
        color: var(--text-color);
        opacity: 0.7;
      }

      #selected-members {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 15px;
      }

      .selected-member {
        background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
        color: white;
        padding: 8px 12px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
      }

      .selected-member:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(61, 90, 241, 0.2);
      }

      .member-remove {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s ease;
      }

      .member-remove:hover {
        background: rgba(255, 255, 255, 0.5);
        transform: scale(1.1);
      }

      .helper-text {
        font-size: 0.9rem;
        color: var(--text-color);
        opacity: 0.7;
        margin-top: 5px;
      }

      .date-group {
        display: flex;
        gap: 20px;
      }

      .date-group .wave-group {
        flex: 1;
      }

      .required-field::after {
        content: " *";
        color: var(--error-text);
      }

      .error-message {
        color: var(--error-text);
        font-size: 0.85rem;
        margin-top: 5px;
        display: none;
      }

      .error-message.visible {
        display: block;
      }

      .input-error {
        border-bottom-color: var(--error-text) !important;
      }

      /* Responsive design */
      @media (max-width: 768px) {
        .form-container {
          width: 95%;
          padding: 30px;
        }
        
        .form-title {
          font-size: 1.8rem;
        }

        .date-group {
          flex-direction: column;
          gap: 0;
        }
      }

      @media (max-width: 480px) {
        .form-container {
          padding: 25px;
        }
        
        .wave-group .label {
          font-size: 16px;
        }
      }

      /* Loading animation for button */
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <!-- Success Popup -->
    <div id="success-popup" class="success-popup">
      <i class="fas fa-check-circle"></i>
      <span>Project created successfully!</span>
      <div class="success-popup-close" onclick="closeSuccessPopup()">
        <i class="fas fa-times"></i>
      </div>
    </div>

    <div class="container">
      <div class="form-container">
        <h2 class="form-title">Create Project</h2>
        
        <form id="project-form">
          <!-- Project Details Section -->
          <div class="form-section">
            <div class="form-section-title">Project Details</div>
            
            <div class="wave-group">
              <input type="text" id="project-title" class="input" required />
              <label class="label required-field">Project Title</label>
              <div id="title-error" class="error-message">Please enter a project title</div>
            </div>

            <div class="wave-group">
              <textarea id="project-description" class="input" required></textarea>
              <label class="label required-field">Project Description</label>
              <div id="description-error" class="error-message">Please enter a project description</div>
            </div>
          </div>

          <!-- Team Members Section -->
          <div class="form-section">
            <div class="form-section-title">Team Members</div>
            <p class="helper-text">Add team members who will collaborate on this project</p>
            
            <div class="user-search-container">
              <i class="fas fa-search search-icon"></i>
              <input 
                type="text" 
                id="team-member-input" 
                class="user-search-input" 
                placeholder="Search by name or email" 
                autocomplete="off" 
              />
              
              <div id="team-member-suggestions" class="suggestions">
                <!-- Suggestions will be populated here -->
              </div>
            </div>
            
            <div id="selected-members">
              <!-- Selected members will appear here -->
            </div>
            
            <!-- Hidden input to store team member IDs -->
            <input type="hidden" id="team-member-ids" name="team-member-ids" />
          </div>

          <!-- Project Timeline Section -->
          <div class="form-section">
            <div class="form-section-title">Project Timeline</div>
            
            <div class="date-group">
              <div class="wave-group">
                <input type="date" id="start-date" class="input" required />
                <label class="label required-field">Start Date</label>
                <div id="start-date-error" class="error-message">Please select a start date</div>
              </div>

              <div class="wave-group">
                <input type="date" id="end-date" class="input" required />
                <label class="label required-field">End Date</label>
                <div id="end-date-error" class="error-message">Please select an end date</div>
              </div>
            </div>
            <div id="date-range-error" class="error-message">End date must be after start date</div>
          </div>

          <button type="submit" id="submit-btn" class="btn">
            <i class="fas fa-plus-circle"></i> Create Project
          </button>
        </form>
      </div>
    </div>

    <script>
      // Function to close success popup
      function closeSuccessPopup() {
        const popup = document.getElementById('success-popup');
        if (popup) {
          popup.style.display = 'none';
        }
      }

      // Function to show success popup
      function showSuccessPopup(message) {
        const popup = document.getElementById('success-popup');
        const messageElement = popup.querySelector('span');
        
        // Set message
        messageElement.textContent = message || 'Project created successfully!';
        
        // Show popup
        popup.style.display = 'flex';
        
        // Auto-hide after 5 seconds
        setTimeout(() => {
          closeSuccessPopup();
        }, 5000);
      }

      // Fetch and insert navbar
      fetch('navbar.php')
        .then(response => response.text())
        .then(data => {
          document.getElementById('navbar-placeholder').innerHTML = data;
          initDarkMode();
        })
        .catch(error => {
          console.error('Error loading navbar:', error);
        });

      // Initialize dark mode
      function initDarkMode() {
        if (localStorage.getItem('darkMode') === 'enabled') {
          document.body.classList.add('dark-mode');
          
          const toggleIcon = document.querySelector('.toggle-icon');
          if (toggleIcon) toggleIcon.textContent = '🌙';
          
          const toggleThumb = document.querySelector('.toggle-thumb');
          if (toggleThumb) toggleThumb.style.left = '26px';
        }
      }

      // Make sure window.toggleDarkMode is available for navbar.php
      window.toggleDarkMode = function() {
        document.body.classList.toggle('dark-mode');
        
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'enabled' : 'disabled');
        
        const toggleIcon = document.querySelector('.toggle-icon');
        if (toggleIcon) {
          toggleIcon.textContent = document.body.classList.contains('dark-mode') ? '🌙' : '☀️';
        }
        
        const toggleThumb = document.querySelector('.toggle-thumb');
        if (toggleThumb) {
          toggleThumb.style.left = document.body.classList.contains('dark-mode') ? '26px' : '2px';
        }
      };
      
      // Also make these functions available globally for navbar
      window.toggleMenu = function() {
        document.querySelector('.navbar').classList.toggle('menu-open');
      };
      
      window.profiledropdown = function() {
        const profileList = document.getElementById('profileList');
        if (profileList) {
          profileList.style.display = profileList.style.display === 'flex' ? 'none' : 'flex';
        }
      };

      // Run after DOM loads
      document.addEventListener('DOMContentLoaded', function() {
        // Initialize form validation
        const form = document.getElementById('project-form');
        const titleInput = document.getElementById('project-title');
        const descriptionInput = document.getElementById('project-description');
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');
        const submitBtn = document.getElementById('submit-btn');
        
        // Set today as minimum date for date inputs
        const today = new Date().toISOString().split('T')[0];
        startDateInput.setAttribute("min", today);
        endDateInput.setAttribute("min", today);
        
        // Update end date min value when start date changes
        startDateInput.addEventListener('change', function() {
          endDateInput.setAttribute("min", this.value);
          
          // Auto-adjust end date if it's before start date
          if (endDateInput.value && endDateInput.value < this.value) {
            endDateInput.value = this.value;
          }
          
          // Validate dates
          validateDates();
        });
        
        endDateInput.addEventListener('change', validateDates);
        
        function validateDates() {
          const startDate = startDateInput.value;
          const endDate = endDateInput.value;
          const dateRangeError = document.getElementById('date-range-error');
          
          if (startDate && endDate && startDate > endDate) {
            dateRangeError.classList.add('visible');
            return false;
          } else {
            dateRangeError.classList.remove('visible');
            return true;
          }
        }
        
        // Expand description textarea dynamically
        descriptionInput.addEventListener('input', function() {
          this.style.height = 'auto';
          this.style.height = this.scrollHeight + 'px';
        });
        
        // Initialize team member search functionality
        const searchInput = document.getElementById('team-member-input');
        const suggestionsBox = document.getElementById('team-member-suggestions');
        const selectedMembersBox = document.getElementById('selected-members');
        const teamMemberIdsInput = document.getElementById('team-member-ids');
        
        let selectedUsers = [];
        let debounceTimeout;
        
        searchInput.addEventListener('input', function() {
          const query = this.value.trim();
          
          // Clear previous timeout
          clearTimeout(debounceTimeout);
          
          // Hide suggestions if input is empty
          if (query.length < 2) {
            suggestionsBox.innerHTML = '';
            suggestionsBox.classList.remove('active');
            return;
          }
          
          // Debounce the search to avoid too many requests
          debounceTimeout = setTimeout(() => {
            // Show loading indicator
            suggestionsBox.innerHTML = '<div class="suggestion-item"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
            suggestionsBox.classList.add('active');
            
            fetch('searchUsers.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query })
            })
            .then(res => res.json())
            .then(users => {
              suggestionsBox.innerHTML = '';
              
              if (users.length === 0) {
                suggestionsBox.innerHTML = '<div class="no-results">No users found</div>';
              } else {
                users.forEach(user => {
                  // Skip already selected users
                  if (selectedUsers.some(u => u.id === user.id)) return;
                  
                  const initials = user.name.split(' ')
                    .map(n => n[0])
                    .join('')
                    .toUpperCase()
                    .substring(0, 2);
                  
                  const userItem = document.createElement('div');
                  userItem.className = 'suggestion-item';
                  userItem.innerHTML = `
                    <div class="user-avatar">${initials}</div>
                    ${user.name}
                  `;
                  
                  userItem.addEventListener('click', () => {
                    addUserToSelection(user);
                    searchInput.value = '';
                    suggestionsBox.innerHTML = '';
                    suggestionsBox.classList.remove('active');
                  });
                  
                  suggestionsBox.appendChild(userItem);
                });
              }
            })
            .catch(error => {
              console.error('Error searching users:', error);
              suggestionsBox.innerHTML = '<div class="no-results">Error searching users</div>';
            });
          }, 300);
        });
        
        // Close suggestions when clicking outside
        document.addEventListener('click', function(e) {
          if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
            suggestionsBox.classList.remove('active');
          }
        });
        
        // Focus input to show suggestions again
        searchInput.addEventListener('focus', function() {
          if (this.value.trim().length >= 2) {
            suggestionsBox.classList.add('active');
          }
        });
        
        function addUserToSelection(user) {
          // Don't add duplicates
          if (selectedUsers.some(u => u.id === user.id)) return;
          
          selectedUsers.push(user);
          updateSelectedMembers();
        }
        
        function removeUserFromSelection(userId) {
          selectedUsers = selectedUsers.filter(user => user.id !== userId);
          updateSelectedMembers();
        }
        
        function updateSelectedMembers() {
          selectedMembersBox.innerHTML = '';
          
          selectedUsers.forEach(user => {
            const memberElement = document.createElement('div');
            memberElement.className = 'selected-member';
            memberElement.innerHTML = `
              <span>${user.name}</span>
              <div class="member-remove" data-id="${user.id}">
                <i class="fas fa-times"></i>
              </div>
            `;
            
            selectedMembersBox.appendChild(memberElement);
          });
          
          // Update hidden input with comma-separated IDs
          teamMemberIdsInput.value = selectedUsers.map(user => user.id).join(',');
          
          // Add event listeners to remove buttons
          document.querySelectorAll('.member-remove').forEach(btn => {
            btn.addEventListener('click', function() {
              const userId = parseInt(this.getAttribute('data-id'));
              removeUserFromSelection(userId);
            });
          });
        }
        
        // Form submission
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          
          // Reset error states
          document.querySelectorAll('.error-message').forEach(el => el.classList.remove('visible'));
          document.querySelectorAll('.input').forEach(el => el.classList.remove('input-error'));
          
          // Validate fields
          let isValid = true;
          
          if (!titleInput.value.trim()) {
            document.getElementById('title-error').classList.add('visible');
            titleInput.classList.add('input-error');
            isValid = false;
          }
          
          if (!descriptionInput.value.trim()) {
            document.getElementById('description-error').classList.add('visible');
            descriptionInput.classList.add('input-error');
            isValid = false;
          }
          
          if (!startDateInput.value) {
            document.getElementById('start-date-error').classList.add('visible');
            startDateInput.classList.add('input-error');
            isValid = false;
          }
          
          if (!endDateInput.value) {
            document.getElementById('end-date-error').classList.add('visible');
            endDateInput.classList.add('input-error');
            isValid = false;
          }
          
          // Validate date range
          if (startDateInput.value && endDateInput.value) {
            if (!validateDates()) {
              isValid = false;
            }
          }
          
          if (!isValid) return;
          
          // Show loading state on button
          const originalBtnContent = submitBtn.innerHTML;
          submitBtn.innerHTML = '<span class="loading-spinner"></span> Creating...';
          submitBtn.disabled = true;
          
          // Prepare data for submission
          const projectData = {
            title: titleInput.value.trim(),
            description: descriptionInput.value.trim(),
            startDate: startDateInput.value,
            endDate: endDateInput.value,
            teamMembers: selectedUsers.map(user => user.id)
          };
          
          // Submit the form data
          fetch('createProject.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(projectData)
          })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') {
              // Show success popup
              showSuccessPopup('Project created successfully!');
              
              // Redirect after a short delay
              setTimeout(() => {
                window.location.href = 'homePage.php';
              }, 2000);
            } else {
              // Reset button and show error
              submitBtn.innerHTML = originalBtnContent;
              submitBtn.disabled = false;
              
              // Show error in red popup
              const popup = document.getElementById('success-popup');
              popup.querySelector('i').className = 'fas fa-exclamation-circle';
              popup.style.backgroundColor = 'var(--error-color)';
              showSuccessPopup('Error: ' + (data.message || 'Failed to create project'));
            }
          })
          .catch(error => {
            console.error('Error creating project:', error);
            submitBtn.innerHTML = originalBtnContent;
            submitBtn.disabled = false;
            
            // Show error in red popup
            const popup = document.getElementById('success-popup');
            popup.querySelector('i').className = 'fas fa-exclamation-circle';
            popup.style.backgroundColor = 'var(--error-color)';
            showSuccessPopup('Something went wrong. Please try again.');
          });
        });

        // Initialize dark mode
        initDarkMode();
      });
    </script>
  </body>
</html>
