<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Task - FlexiDesk</title>
    <link rel="stylesheet" href="navbarStyle.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <style>
      /* Task Form Container */
      .task-container {
        width: 80%;
        max-width: 800px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
        margin: 80px auto;
      }

      /* Form Styles */
      .task-form label {
        font-weight: bold;
        margin-top: 10px;
        display: block;
      }

      .task-form input,
      .task-form select,
      .task-form textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
      }

      .task-form textarea {
        resize: vertical;
        height: 100px;
      }

      /* Checkbox */
      .checkbox-group {
        display: flex;
        align-items: center;
        margin-top: 10px;
      }

      .checkbox-group input {
        width: auto;
        margin-right: 10px;
      }

      /* File Upload */
      .file-upload {
        display: none;
      }

      /* Subtask Section */
      .subtask-container {
        margin-top: 10px;
      }

      .subtask {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
      }

      .subtask input {
        flex: 1;
      }

      .remove-subtask {
        margin-left: 10px;
        background: red;
        color: white;
        border: none;
        padding: 5px;
        cursor: pointer;
        border-radius: 5px;
      }

      /* Submit Button */
      .submit-btn {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 18px;
        border-radius: 5px;
        margin-top: 15px;
      }

      .submit-btn:hover {
        background: #0056b3;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .task-container {
          width: 95%;
        }
      }
    </style>

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Task Creation Form -->
    <div class="task-container">
      <h2>Create a New Task</h2>
      <form class="task-form">

        <!-- Project Selection -->
        <label for="projectID">Project *</label>
        <select id="projectID" required>
        </select>

        <!-- Task Name -->
        <label for="taskName">Task Name</label>
        <input
          type="text"
          id="taskName"
          placeholder="Enter task name"
          required
        />

        <!-- Task Description -->
        <label for="taskDescription">Task Description</label>
        <textarea
          id="taskDescription"
          placeholder="Describe the task..."
        ></textarea>

        <!-- Task start Date -->
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate" required />

        <!-- Task end Date -->
        <label for="endDate">End Date</label>
        <input type="date" id="endDate" required />

        <!-- Priority -->
        <label for="priority">Priority </label>
        <select id="priority" required>
          <option value="low">🟢 Low</option>
          <option value="medium-low">🔵 Medium-Low</option>
          <option value="medium">🟡 Medium</option>
          <option value="high">🟠 High</option>
          <option value="critical">🔴 Critical</option>
        </select>

        <!-- Assign to -->
        <label for="assignTo">Assign to </label>
        <select id="assignTo" required>
        </select>

        <!-- File Requirement -->
        <div class="checkbox-group">
          <input
            type="checkbox"
            id="fileRequired"
            onclick="toggleFileUpload()"
          />
          <label for="fileRequired">Does this task require a file?</label>
        </div>

        <!-- fileUpload -->
        <div class="file-upload" id="fileUpload">
          <label for="taskFile">Upload File</label>
          <input type="file" id="taskFile" />
        </div>

        <button type="submit" class="submit-btn">Create Task</button>
      </form>
    </div>

    <!-- JavaScript to Handle File Upload & Subtasks -->
    <script>
      function toggleFileUpload() {
        let fileUpload = document.getElementById('fileUpload');
        let checkbox = document.getElementById('fileRequired');

        if (checkbox.checked) {
          fileUpload.style.display = 'block';
        } else {
          fileUpload.style.display = 'none';
        }
      }

      // Fetch and insert navbar
      fetch('navbar.html')
        .then((response) => response.text())
        .then((data) => {
          document.getElementById('navbar-placeholder').innerHTML = data;
        })
        .catch((error) => console.error('Error loading navbar:', error));

// Run after DOM loads
document.addEventListener("DOMContentLoaded", function () {
  const projectSelect = document.getElementById("projectID");
  const assignToSelect = document.getElementById("assignTo");
  const startDateInput = document.getElementById("startDate");
  const endDateInput = document.getElementById("endDate");

  // Fetch projects where user is manager
  fetch("loadDataTaskCreate.php?projects")
    .then((res) => res.json())
    .then((projects) => {
      projects.forEach((project) => {
        const option = document.createElement("option");
        option.value = project.projectID;
        option.textContent = project.title;
        option.dataset.start = project.startDate;
        option.dataset.end = project.endDate;
        projectSelect.appendChild(option);
      });
    })
    .catch((err) => console.error("Error loading projects:", err));

    // When a project is selected, fetch its team members & update date limits
      projectSelect.addEventListener("change", function () {
        const selectedProjectID = this.value;
        assignToSelect.innerHTML = "";

        const selectedOption = this.options[this.selectedIndex];
        const projStart = selectedOption.dataset.start;
        const projEnd = selectedOption.dataset.end;

        startDateInput.setAttribute("min", projStart);
        startDateInput.setAttribute("max", projEnd);
        endDateInput.setAttribute("min", projStart);
        endDateInput.setAttribute("max", projEnd);

        if (!selectedProjectID) {
          const warning = document.createElement("option");
          warning.textContent = "Please select a project first";
          assignToSelect.appendChild(warning);
          return;
        }

        fetch(`loadDataTaskCreate.php?members&projectID=${selectedProjectID}`)
          .then((res) => res.json())
          .then((members) => {
            if (members.length === 0) {
              const noMembers = document.createElement("option");
              noMembers.textContent = "No members found for this project";
              assignToSelect.appendChild(noMembers);
              return;
            }

            const defaultOption = document.createElement("option");
            defaultOption.textContent = "Select a team member";
            defaultOption.value = "";
            assignToSelect.appendChild(defaultOption);

            members.forEach((member) => {
              const option = document.createElement("option");
              option.value = member.userID;
              option.textContent = member.name;
              assignToSelect.appendChild(option);
            });
          })
          .catch((err) => {
            console.error("Error loading team members:", err);
            const errorOption = document.createElement("option");
            errorOption.textContent = "Failed to load members";
            assignToSelect.appendChild(errorOption);
          });
      });
    });
    </script>
  </body>
</html>
