<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Task - FlexiDesk</title>
    <link rel="stylesheet" href="navbarStyle.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <style>
      /* Task Form Container */
      .task-container {
        width: 80%;
        max-width: 800px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
        margin: 80px auto;
      }

      /* Form Styles */
      .task-form label {
        font-weight: bold;
        margin-top: 10px;
        display: block;
      }

      .task-form input,
      .task-form select,
      .task-form textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
      }

      .task-form textarea {
        resize: vertical;
        height: 100px;
      }

      /* Checkbox */
      .checkbox-group {
        display: flex;
        align-items: center;
        margin-top: 10px;
      }

      .checkbox-group input {
        width: auto;
        margin-right: 10px;
      }

      /* File Upload */
      .file-upload {
        display: none;
      }

      /* Subtask Section */
      .subtask-container {
        margin-top: 10px;
      }

      .subtask {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
      }

      .subtask input {
        flex: 1;
      }

      .remove-subtask {
        margin-left: 10px;
        background: red;
        color: white;
        border: none;
        padding: 5px;
        cursor: pointer;
        border-radius: 5px;
      }

      /* Submit Button */
      .submit-btn {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 18px;
        border-radius: 5px;
        margin-top: 15px;
      }

      .submit-btn:hover {
        background: #0056b3;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .task-container {
          width: 95%;
        }
      }
    </style>

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Task Creation Form -->
    <div class="task-container">
      <h2>Create a New Task</h2>
      <form class="task-form">
        <label for="taskName">Task Name *</label>
        <input
          type="text"
          id="taskName"
          placeholder="Enter task name"
          required
        />

        <label for="taskDescription">Task Description</label>
        <textarea
          id="taskDescription"
          placeholder="Describe the task..."
        ></textarea>

        <label for="dueDate">Due Date *</label>
        <input type="date" id="dueDate" required />

        <label for="priority">Priority *</label>
        <select id="priority" required>
          <option value="low">🟢 Low</option>
          <option value="medium-low">🔵 Medium-Low</option>
          <option value="medium">🟡 Medium</option>
          <option value="high">🟠 High</option>
          <option value="critical">🔴 Critical</option>
        </select>

        <label for="assignTo">Assign to *</label>
        <select id="assignTo" required>
          <option value="">Select a team member</option>
          <option value="Salman">Salman Hassan</option>
          <option value="Ammar">Ammar Abdo</option>
          <option value="Abdulrahaman">Abdulrahman Kateb</option>
          <option value="Saud">Saud Al-Ruzaiqi</option>
          <option value="Abdulaziz">Abdulaziz Al-Shafee</option>
        </select>

        <!-- Task Dependencies -->
        <label for="relatedTask">Is this task related to another task?</label>
        <select id="relatedTask">
          <option value="">No related task</option>
          <option value="task1">Task 1</option>
          <option value="task2">Task 2</option>
          <option value="task3">Task 3</option>
        </select>

        <!-- File Requirement -->
        <div class="checkbox-group">
          <input
            type="checkbox"
            id="fileRequired"
            onclick="toggleFileUpload()"
          />
          <label for="fileRequired">Does this task require a file?</label>
        </div>

        <div class="file-upload" id="fileUpload">
          <label for="taskFile">Upload File</label>
          <input type="file" id="taskFile" />
        </div>

        <!-- Subtasks -->
        <label for="subtasks">Does this task have subtasks?</label>
        <div class="subtask-container" id="subtaskContainer">
          <button type="button" onclick="addSubtask()">+ Add Subtask</button>
        </div>

        <button type="submit" class="submit-btn">Create Task</button>
      </form>
    </div>

    <!-- JavaScript to Handle File Upload & Subtasks -->
    <script>
      function toggleFileUpload() {
        let fileUpload = document.getElementById('fileUpload');
        let checkbox = document.getElementById('fileRequired');

        if (checkbox.checked) {
          fileUpload.style.display = 'block';
        } else {
          fileUpload.style.display = 'none';
        }
      }

      function addSubtask() {
        let container = document.getElementById('subtaskContainer');
        let subtaskDiv = document.createElement('div');
        subtaskDiv.classList.add('subtask');

        let subtaskInput = document.createElement('input');
        subtaskInput.type = 'text';
        subtaskInput.placeholder = 'Enter subtask';
        subtaskDiv.appendChild(subtaskInput);

        let removeButton = document.createElement('button');
        removeButton.textContent = 'X';
        removeButton.classList.add('remove-subtask');
        removeButton.onclick = function () {
          container.removeChild(subtaskDiv);
        };

        subtaskDiv.appendChild(removeButton);
        container.appendChild(subtaskDiv);
      }

      // Fetch and insert navbar
      fetch('navbar.html')
        .then((response) => response.text())
        .then((data) => {
          document.getElementById('navbar-placeholder').innerHTML = data;
        })
        .catch((error) => console.error('Error loading navbar:', error));
    </script>
  </body>
</html>
