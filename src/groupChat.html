<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Chat - FlexiDesk</title>
    <link rel="stylesheet" href="navbarStyle.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <style>
      /* Dropdown Menu */
      .project-btn {
        background-color: white;
        color: #3498db;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
        position: relative;
      }

      .project-btn:hover {
        background-color: #2980b9;
        color: white;
      }

      .project-list {
        position: absolute;
        right: 0; /* Aligns it to the right under the button */
        top: 100%; /* Places it right below the button */
        background: white;
        width: 200px;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        display: none;
        flex-direction: column;
        padding: 10px 0;
        z-index: 10;
      }

      .project-item {
        padding: 10px;
        cursor: pointer;
        transition: background 0.3s;
      }

      .project-item:hover {
        background: #3498db;
        color: white;
      }

      /* Chat Container */
      .chat-container {
        width: 90%;
        max-width: 800px;
        background: white;
        border-radius: 10px;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        height: 500px;
        overflow: hidden;
        margin: 80px auto;
      }

      /* Chat Header */
      .chat-header {
        background-color: #3498db;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
      }
      .chat-header a {
        color: white;
        font-size: 20px;
        font-weight: bold;
      }

      /* Chat Messages */
      .chat-box {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      /* Chat Message */
      .message {
        max-width: 80%;
        padding: 10px;
        border-radius: 10px;
        margin: 5px 0;
        display: flex;
        flex-direction: column;
      }

      /* Sender Name */
      .sender {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 3px;
      }

      /* Messages Alignment */
      .message.sent {
        align-self: flex-end;
        background: #007bff;
        color: white;
      }

      .message.received {
        align-self: flex-start;
        background: #f1f1f1;
        color: black;
      }

      /* Chat Input */
      .chat-input {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
        background: #fff;
      }

      .chat-input input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
      }

      .chat-input button {
        padding: 10px 15px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
        margin-left: 10px;
        border-radius: 5px;
      }

      .chat-input button:hover {
        background: #0056b3;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .nav-links {
          flex-direction: column;
          gap: 1rem;
        }

        .project-btn {
          width: 100%;
        }

        .project-list {
          width: 100%;
        }
      }
    </style>

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Chat Container -->
    <div class="main-content">
      <div class="chat-container">
        <div class="chat-header">
          <a id="chatHeader">Project Alpha Chat</a>
          <button class="project-btn" onclick="toggleDropdown()">
            Select Project
          </button>
          <div class="project-list" id="projectList">
            <!-- Projects will be loaded dynamically here -->
          </div>
        </div>

        <div class="chat-box" id="chatBox">
          <!-- Example Messages -->
          <div class="message received">
            <span class="sender">John Doe</span>
            <p>Hey team, let's finalize the project deadline.</p>
          </div>

          <div class="message sent">
            <span class="sender">You</span>
            <p>Sure! I think we should aim for next Monday.</p>
          </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input">
          <!-- Project Dropdown -->
          <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
          />
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <script>
      let currentProjectId = null;
      const userName = null;
    
      function toggleDropdown() {
        const dropdown = document.getElementById('projectList');
        dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
      }
    
      function switchProject(projectName, projectId) {
        document.getElementById('chatHeader').textContent = projectName + ' Chat';
        currentProjectId = projectId;
        document.getElementById('chatBox').innerHTML = ''; 
        fetchMessages(); 
        toggleDropdown();
      }
    
      function loadUserName() {
        fetch('getUser.php')
          .then(res => res.json())
          .then(user => {
            if (user.error) {
              console.error(user.error);
              return;
            }
            userName = user.name; // Only set the name
          })
          .catch(error => console.error('Failed to load user name:', error));
      }


      function loadUserProjects() {
        fetch('getMyProjects.php')
          .then(response => response.json())
          .then(projects => {
            const projectList = document.getElementById('projectList');
            projectList.innerHTML = '';
    
            projects.forEach(project => {
              const div = document.createElement('div');
              div.className = 'project-item';
              div.textContent = project.title;
              div.onclick = () => switchProject(project.title, project.id);
              projectList.appendChild(div);
            });
    
            if (projects.length > 0) {
              switchProject(projects[0].title, projects[0].id);
            }
          })
          .catch(error => console.error('Error loading projects:', error));
      }
    
      function sendMessage() {
        const input = document.getElementById('messageInput');
        const messageText = input.value.trim();
    
        if (!messageText || currentProjectId === null) return;
    
        fetch('sendMessage.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            projectId: currentProjectId,
            userName: userName,
            message: messageText
          })
        }).then(() => {
          input.value = '';
          fetchMessages();
        });
      }
    
      function fetchMessages() {
        if (currentProjectId === null) return;
    
        fetch(`getMessages.php?projectId=${currentProjectId}`)
          .then(res => res.json())
          .then(data => {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
    
            data.forEach(msg => {
              const div = document.createElement('div');
              div.classList.add('message');
              div.classList.add(msg.user_name === userName ? 'sent' : 'received');
    
              const sender = document.createElement('span');
              sender.classList.add('sender');
              sender.textContent = msg.user_name;
    
              const content = document.createElement('p');
              content.textContent = msg.message;
    
              div.appendChild(sender);
              div.appendChild(content);
              chatBox.appendChild(div);
            });
    
            chatBox.scrollTop = chatBox.scrollHeight;
          });
      }
    
      window.onload = function () {
        loadUserName();
        loadUserProjects();
        fetch('navbar.php')
          .then(response => response.text())
          .then(data => {
            document.getElementById('navbar-placeholder').innerHTML = data;
          })
          .catch(error => console.error('Error loading navbar:', error));
      };
    
      setInterval(fetchMessages, 5000); // Auto-refresh chat every 5 sec
    </script>
  </body>
</html>
