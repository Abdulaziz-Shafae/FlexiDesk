<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat View - FlexiDesk</title>
  <link rel="stylesheet" href="navbarStyle.css" />
  <link rel="stylesheet" href="viwesStyle.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="viwes-container">
      <div class="tabs">
        <a href="ganttView.html" class="tab">Gantt</a>
        <a href="tableView.html" class="tab">Table</a>
        <a href="calenderView.html" class="tab">Calendar</a>
        <a href="groupChat.html" class="tab active">Chat</a>
        <a href="whiteboard.html" class="tab">Whiteboard</a>
      </div>

      <div class="viwes-header">
        <h1 id="chatHeader">Chat</h1>
      </div>

      <!-- Chat Container -->
      <div class="chat-container">
        <div class="chat-box" id="chatBox"></div>

        <div class="chat-input">
          <input type="text" id="messageInput" placeholder="Type a message..." />
          <button id="sendMessageBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .chat-container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 10px;
      box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      height: 500px;
      overflow: hidden;
      margin: 0 auto;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: #fff;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .chat-input button {
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-left: 10px;
      border-radius: 5px;
    }

    .chat-input button:hover {
      background: #0056b3;
    }

    .message {
      max-width: 80%;
      padding: 10px;
      border-radius: 10px;
      margin: 5px 0;
      display: flex;
      flex-direction: column;
    }

    .message.sent {
      align-self: flex-end;
      background: #007bff;
      color: white;
    }

    .message.received {
      align-self: flex-start;
      background: #f1f1f1;
      color: black;
    }

    .sender {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 3px;
    }
  </style>

  <script>
    
    let currentProjectId = null;
    let currentProjectName = null;

    document.addEventListener("DOMContentLoaded", () => {
      currentProjectId = sessionStorage.getItem("selectedProjectID");
      currentProjectName = sessionStorage.getItem("selectedProjectName");

      if (!currentProjectId) {
        alert("No project selected. Redirecting...");
        window.location.href = "dashboard.html"; // or your intended fallback
        return;
      }

      document.getElementById("chatHeader").innerText = currentProjectName || "Chat";

      // Start polling
      setInterval(fetchMessages, 5000);
      fetchMessages();

      // Event listener
      document.getElementById("sendMessageBtn").addEventListener("click", sendMessage);
    });

    function fetchMessages() {
      if (!currentProjectId) return;

      fetch(`getMessages.php?project_id=${currentProjectId}`)
      .then(res => res.json())
        .then(messages => {
          const chatBox = document.getElementById("chatBox");
          chatBox.innerHTML = "";
          
          if (messages.length === 0) {
            chatBox.innerHTML = "<p style='color: #888; text-align: center;'>No messages yet.</p>";
            return;
          }

          messages.forEach(msg => {
            const msgDiv = document.createElement("div");
            msgDiv.className = "message " + (msg.is_self ? "sent" : "received");
            msgDiv.innerHTML = `<div class="sender">${msg.username}</div><div>${msg.message}</div>`;
            chatBox.appendChild(msgDiv);
          });

          chatBox.scrollTop = chatBox.scrollHeight;
        })
        .catch(err => console.error("Error loading messages:", err));
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const message = input.value.trim();
      if (!message || !currentProjectId) return;

      fetch("sendMessage.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `project_id=${encodeURIComponent(currentProjectId)}&message=${encodeURIComponent(message)}`
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            input.value = "";
            fetchMessages();
          }
        })
        .catch(err => console.error("Error sending message:", err));
    }

    fetch("navbar.php")
      .then((res) => res.text())
      .then((data) => (document.getElementById("navbar-placeholder").innerHTML = data));
  </script>
</body>
</html>
