<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table View - FlexiDesk</title>
    <link rel="stylesheet" href="navbarStyle.css" />
    <link rel="stylesheet" href="viwesStyle.css" />
    <script src="script.js" defer></script>
    <style>
      .table-container {
        width: 100%;
        background: white;
        border-radius: 10px;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #ddd;
        position: relative;
      }

      th {
        background: #2c3e50;
        color: white;
      }

      tr:hover {
        background: #f1f1f1;
      }

    </style>
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="viwes-container">      
        <div class="tabs">
          <a href="ganttView.html" class="tab ">Gantt</a>
          <a href="test.html" class="tab">Gantt test</a>
          <a href="tableView.html" class="tab active">Table</a>
          <a href="calenderView.html" class="tab">Calendar</a>
        </div>
        <div class="viwes-header">
          <h1>Project Name</h1>
          <button class="add-task-btn" id="openPopupBtn">+ Add Task</button>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <label>
              <select id="status-filter" class="Toolbar-btn">
                <option value="">All Status</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </label>

            <label>
              <select id="priority-filter" class="Toolbar-btn">
                <option value="">All Priorities</option>
                <option value="low">Low</option>
                <option value="medium-low">Medium-Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </label>
          </div>

          <div class="checkbox-container">
            <input type="checkbox" id="assigned-to-me" />
            <label for="assigned-to-me">Show only my tasks</label>
          </div>
        </div>

        <!-- Task Table -->
        <div class="table-container">
          <table id="task-table">
            <thead>
              <tr>
                <th>Task Name</th>
                <th>Assigned To</th>
                <th>Priority</th>
                <th>Due Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>


        <div id="task-popup" class="popup_tasks"></div>
      </div>
    </div>

    <!-- Popup add task container -->
    <div id="popup-container"></div> 

    <script>
      // Global refresh hook for popup
      window.refreshTasks = () => {
        loadCalendar(currentMonth, currentYear); 
      };

      const statusFilter = document.getElementById("status-filter");
      const priorityFilter = document.getElementById("priority-filter");
      const assignedCheckbox = document.getElementById("assigned-to-me");
      const taskTableBody = document.querySelector("#task-table tbody");
      const popup = document.getElementById("task-popup");

      const projectID = sessionStorage.getItem("selectedProjectID");

      function getTasks() {
        const payload = {
          projectID,
          priority: priorityFilter.value,
          status: statusFilter.value,
          onlyMine: assignedCheckbox.checked
        };

        fetch("getProjectTask.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then((res) => res.json())
          .then((tasks) => {
            taskTableBody.innerHTML = "";
            tasks.forEach((task) => {
              const tr = document.createElement("tr");

              tr.innerHTML = `
                <td>${task.taskName}</td>
                <td>${task.assignedToName || 'Unassigned'}</td>
                <td>${task.priority}</td>
                <td>${new Date(task.endDate).toLocaleDateString()}</td>
                <td>${task.status}</td>
              `;

              tr.addEventListener("mouseenter", (e) => {
                popup.innerHTML = `
                  <div style="padding: 10px; border-radius: 8px; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 300px;">
                    <strong>Task Type:</strong> ${task.taskType}<br>
                    <strong>Task:</strong> ${task.taskName}<br>
                    <strong>Description:</strong> ${task.description}<br>
                    <strong>Assigned To:</strong> ${task.assignedToName || 'Unassigned'}<br>
                    <strong>Priority:</strong> ${task.priority}<br>
                    <strong>Status:</strong> ${task.status}<br>
                    <strong>Start Date:</strong> ${task.startDate}<br>
                    <strong>End Date:</strong> ${task.endDate}
                  </div>
                `;
                const rect = e.target.getBoundingClientRect();
                popup.style.top = `${rect.bottom + window.scrollY + -110}px`;
                popup.style.left = `${rect.left}px`;                 
                popup.style.display = "block";
              });

              tr.addEventListener("mouseleave", () => {
                popup.style.display = "none";
              });

              tr.addEventListener("click", () => {
                openPopup(task); // task object already available
              });

              taskTableBody.appendChild(tr);
            });
          })
          .catch((err) => {
            console.error("Error loading tasks:", err);
          });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const projectName = sessionStorage.getItem("selectedProjectName");
        const projectRole = sessionStorage.getItem("selectedProjectRole");

        if (!projectID) {
          alert("No project selected.");
          return;
        }

        document.querySelector(".viwes-header h1").textContent = projectName || "Project";

        if (projectRole !== "Manager") {
          document.getElementById("openPopupBtn").style.display = "none";
        }

        getTasks();
        statusFilter.addEventListener("change", getTasks);
        priorityFilter.addEventListener("change", getTasks);
        assignedCheckbox.addEventListener("change", getTasks);
      });

      fetch("navbar.php")
        .then((res) => res.text())
        .then((data) => (document.getElementById("navbar-placeholder").innerHTML = data));
    
        document.getElementById("openPopupBtn")?.addEventListener("click", () => {
          const projectID = sessionStorage.getItem("selectedProjectID");
          openPopup(null, projectID); // null task = new task
        });

    </script>
  </body>
</html>
