<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Send Test</title>
</head>
<body>

  <h2>Test Email Sending</h2>
  <input type="email" id="email" placeholder="Enter your email" required>
  <button onclick="sendEmail()">Send Verification Email</button>

  <p id="response"></p>

  <script>
    async function sendEmail() {
      const email = document.getElementById('email').value;
      const responseEl = document.getElementById('response');

      if (!email || !email.includes('@')) {
        responseEl.textContent = "Please enter a valid email.";
        return;
      }

      responseEl.textContent = "Sending...";

      try {
        const res = await fetch("testVerify.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ step: "send_code",  user: {email: email} })
        });

        const data = await res.json();
        if (data.status === "sent") {
          responseEl.textContent = "✅ Email sent successfully!";
        } else {
          responseEl.textContent = "❌ Failed to send: " + data.message;
        }
      } catch (err) {
        responseEl.textContent = "❌ Error: " + err.message;
      }
    }
  </script>

</body>
</html>
