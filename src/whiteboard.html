<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Whiteboard</title>
  <script src="https://www.whiteboard.team/dist/api.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #wt-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<!-- 🔲 This is where the whiteboard will show -->
<div id="wt-container"></div>

<script>
  // Replace this with your actual clientId
  const clientId = '92411c1d60ca1c0b68abbd94665f1323';

  // You can either generate this dynamically or pass it from URL like ?board=abc123
  const boardCode = 'flexidesk-' + crypto.randomUUID();

  const wt = new api.WhiteboardTeam('#wt-container', {
    clientId: clientId,
    boardCode: boardCode,
    participant: {
      name: 'User',
      role: 'editor',
      permissions: ['view_templates', 'view_chat']
    },
    board: {
      bg: 'Dot',
      tool: 'pen',
      color: '#000000'
    }
  });

  wt.waitUntilReady()
    .then(ctx => console.log('✅ Whiteboard Ready:', ctx.uid))
    .catch(error => console.error('❌ Whiteboard Error:', error));
</script>

</body>
</html>
